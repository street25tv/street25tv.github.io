<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b12">
<title>Street25 · Revendedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--bg2:#12121c;--card:#171724;--line:#262636;--txt:#f3f3f7;--mut:#9a9ab0;--acc:#ff3d6e;--acc2:#7b5cff;--ok:#22c55e;--warn:#f59e0b;--rad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,18,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11px;border:1px solid var(--line);color:var(--mut);padding:2px 8px;border-radius:999px}
.sp{flex:1}
.ibtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;cursor:pointer}
main{padding:14px 0 120px}
h2{font-size:18px;margin:18px 0 10px}
.saldo{background:linear-gradient(135deg,rgba(123,92,255,.25),rgba(255,61,110,.2));border:1px solid var(--line);border-radius:18px;padding:16px}
.saldo small{color:var(--mut);font-size:12.5px}
.saldo b.big{display:block;font-size:32px;line-height:1.15;margin:2px 0 6px}
.cuota{font-size:13px;margin-top:6px}.cuota.bad{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px}
nav.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:9px 4px;cursor:pointer;font-size:13px}
nav.tabs button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px}
.prod{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.prod .n{font-weight:600}.prod .c{color:var(--mut);font-size:12px}
.prod .p{text-align:right}.prod .p b{display:block;font-size:17px}.prod .p s{color:var(--mut);font-size:12px}
.gan{font-size:12px;color:var(--ok)}
.qty{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:18px;cursor:pointer}
.qty button:disabled{opacity:.35}
.qty b{min-width:18px;text-align:center}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn.wa{background:#25d366;color:#05250f}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.full{width:100%}
input.in,select.in{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;outline:none}
input.in:focus{border-color:var(--acc2)}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.err{color:var(--acc);font-size:14px;margin-top:8px;min-height:1px}
.ok{color:var(--ok)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(34,197,94,.4)}.pill.warn{color:var(--warn);border-color:rgba(245,158,11,.45)}.pill.bad{color:var(--acc);border-color:rgba(255,61,110,.45)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,18,28,.97);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;gap:10px;align-items:center}
.bar .t{flex:1;font-size:13px;color:var(--mut)}.bar .t b{display:block;color:var(--txt);font-size:18px}
.oculto{display:none!important}
.load{color:var(--mut);padding:30px 0;text-align:center}
.empty{color:var(--mut);text-align:center;padding:24px 10px}
pre.acc{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font:inherit;font-size:13px}
.cli{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc)}
.pay{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.pay .r{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:4px}
.copy{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut);cursor:pointer;margin-top:12px}
.drop.has{border-color:var(--ok);color:var(--txt)}.drop img{max-width:160px;max-height:160px;border-radius:8px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
td.m{text-align:right;white-space:nowrap;font-weight:600}.neg{color:var(--acc)}.pos{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lbox{width:100%;max-width:360px}
.lbox .logo{font-size:30px;text-align:center}
.tools{display:flex;gap:8px;margin-bottom:10px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
</style>
</head>
<body>

<section id="login">
  <div class="lbox">
    <div class="logo">STREET<span>25</span></div>
    <div class="mut" style="text-align:center;margin-bottom:18px">Portal de revendedores</div>
    <label class="f" for="lTel">Tu WhatsApp</label>
    <input class="in" id="lTel" type="tel" inputmode="numeric" maxlength="13" placeholder="Ej: 3001234567" autocomplete="tel">
    <label class="f" for="lPin">PIN</label>
    <input class="in" id="lPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <div class="err" id="lErr"></div>
    <button class="btn full" id="lBtn" style="margin-top:14px" onclick="entrar()">Entrar</button>
    <p class="mut" style="text-align:center;margin-top:18px">¿Quieres ser revendedor o perdiste tu PIN? <a id="lWa" style="color:#7dd3fc" target="_blank" rel="noopener" href="https://wa.me/573044430163">Escríbenos</a></p>
  </div>
</section>

<section id="app" class="oculto">
  <header><div class="wrap">
    <div class="logo">STREET<span>25</span></div><span class="tag">Socios</span>
    <div class="sp"></div>
    <button class="ibtn" onclick="cargar()" title="Actualizar">⟳</button>
    <button class="ibtn" onclick="salir()">Salir</button>
  </div></header>
  <main class="wrap">
    <div class="saldo" id="saldoBox"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="vista"><div class="load">Cargando…</div></div>
  </main>
  <div class="bar oculto" id="bar"><div class="wrap"><div class="t" id="barT"></div><button class="btn" onclick="abrirCompra()">Comprar →</button></div></div>
</section>

<div class="modal" id="mCompra" onclick="if(event.target===this)cerrar('mCompra')"><div class="sheet" id="mCompraB"></div></div>
<div class="toast" id="toast"></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzRPSLHYnZpNmhsGFux72vykDAjs8ORUZd1qDKn4gxAU16Xh4SqdxLItfl1jHOeC6hW/exec";
var TOKEN = "", D = null, VISTA = "comprar", CARRO = {}, BUSCA = "", SEL = {}, COMP = null, SONDEO = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function pesos(n) { n = Math.round(Number(n) || 0); return (n < 0 ? "-$" : "$") + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("show"); }, 1800); }
function copiar(t) { var ok = function () { toast("Copiado ✓"); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { window.prompt("Copia:", t); }); else window.prompt("Copia:", t); }
function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function guardarSes(v) { try { if (v) sessionStorage.setItem("st25_rev", v); else sessionStorage.removeItem("st25_rev"); } catch (e) {} }
function leerSes() { try { return sessionStorage.getItem("st25_rev") || ""; } catch (e) { return ""; } }
function abrir(id) { $(id).classList.add("show"); document.body.style.overflow = "hidden"; }
function cerrar(id) { $(id).classList.remove("show"); document.body.style.overflow = ""; }

function api(accion, datos) {
  var cuerpo = Object.assign({ accion: accion, token: TOKEN }, datos || {});
  var intento = function (n) {
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(cuerpo) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(function (e) { if (n < 1 && /HTTP 5|Failed|NetworkError|Load failed/i.test(String(e.message)) && accion !== "rev_comprar" && accion !== "rev_renovar" && accion !== "rev_recarga") return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return intento(n + 1); }); throw e; });
  };
  return intento(0).then(function (r) {
    if (r && r.error === "SESION_VENCIDA") { cerrarSesion("Tu sesión venció. Entra de nuevo."); throw new Error("Sesión vencida"); }
    if (!r || r.error) throw new Error((r && r.error) || "Sin respuesta del servidor");
    return r;
  });
}

// ---------- Ingreso ----------
function entrar() {
  var tel = $("lTel").value.replace(/\D/g, ""), pin = $("lPin").value.replace(/\D/g, "");
  if (tel.length === 12 && tel.indexOf("57") === 0) tel = tel.slice(2);
  if (tel.length !== 10) return $("lErr").textContent = "Escribe tu WhatsApp de 10 dígitos.";
  if (pin.length < 4) return $("lErr").textContent = "Escribe tu PIN.";
  var b = $("lBtn"); b.disabled = true; b.textContent = "Entrando…"; $("lErr").textContent = "";
  try { localStorage.setItem("st25_rev_tel", tel); } catch (e) {}
  api("rev_login", { contacto: tel, pin: pin }).then(function (r) {
    TOKEN = r.token; guardarSes(TOKEN); $("lPin").value = "";
    $("login").classList.add("oculto"); $("app").classList.remove("oculto"); cargar();
  }).catch(function (e) { $("lErr").textContent = e.message; }).then(function () { b.disabled = false; b.textContent = "Entrar"; });
}
function cerrarSesion(t) { TOKEN = ""; guardarSes(""); D = null; $("app").classList.add("oculto"); $("login").classList.remove("oculto"); $("lErr").textContent = t || ""; if (SONDEO) { clearInterval(SONDEO); SONDEO = null; } }
function salir() { if (TOKEN) api("rev_salir").catch(function () {}); cerrarSesion("Sesión cerrada."); }

// ---------- Datos ----------
function cargar(silencioso) {
  if (!silencioso && !D) $("vista").innerHTML = '<div class="load">Cargando…</div>';
  return api("rev_inicio").then(function (r) {
    D = r; pintarSaldo(); pintarTabs(); VISTAS[VISTA]();
    var pend = r.recargas.some(function (x) { return x.estado === "Pendiente"; });
    if (pend && !SONDEO) SONDEO = setInterval(function () { cargar(true); }, 20000);
    if (!pend && SONDEO) { clearInterval(SONDEO); SONDEO = null; }
  }).catch(function (e) { if (!silencioso) $("vista").innerHTML = '<div class="card"><div class="err">⚠️ ' + esc(e.message) + '</div><button class="btn sec sm" style="margin-top:10px" onclick="cargar()">Reintentar</button></div>'; });
}
function pintarSaldo() {
  var pend = D.recargas.filter(function (x) { return x.estado === "Pendiente"; })[0];
  $("saldoBox").innerHTML = '<div class="row"><div><small>Hola, ' + esc(D.nombre.split(" ")[0]) + ' · ' + esc(D.codigo) + ' · tu descuento ' + D.pct + '%</small><b class="big">' + pesos(D.saldo) + '</b></div><span class="sp"></span>' +
    '<button class="btn sm" onclick="ir(\'recargar\')">+ Recargar</button></div>' +
    '<div class="cuota' + (D.cuota.al_dia ? "" : " bad") + '">' + (D.cuota.al_dia ? "✅ " : "⚠️ ") + esc(D.cuota.texto) + '</div>' +
    (pend ? '<div class="cuota">⏳ Recarga de ' + pesos(pend.monto) + ' en revisión. Se carga sola cuando la aprobemos.</div>' : '');
}
var TABS = [["comprar", "🛒 Comprar"], ["clientes", "👥 Clientes"], ["recargar", "💳 Recargar"], ["movs", "📄 Saldo"]];
function pintarTabs() { $("tabs").innerHTML = TABS.map(function (t) { return '<button class="' + (t[0] === VISTA ? "on" : "") + '" onclick="ir(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join(""); }
function ir(v) { VISTA = v; pintarTabs(); VISTAS[v](); pintarBarra(); }
var VISTAS = {};

// ---------- Comprar ----------
function item(id) { return D.catalogo.filter(function (x) { return x.id === id; })[0]; }
function totalCarro() { var t = 0, n = 0, g = 0; Object.keys(CARRO).forEach(function (id) { var it = item(id); if (!it) return; t += it.precio * CARRO[id]; g += (it.publico - it.precio) * CARRO[id]; n += CARRO[id]; }); return { t: t, n: n, g: g }; }
function pintarBarra() {
  var c = totalCarro(), bar = $("bar");
  bar.classList.toggle("oculto", !c.n || VISTA !== "comprar");
  $("barT").innerHTML = c.n ? '<b>' + pesos(c.t) + '</b>' + c.n + (c.n === 1 ? " producto" : " productos") + (c.t > D.saldo ? ' · <span class="neg">saldo insuficiente</span>' : ' · te queda ' + pesos(D.saldo - c.t)) : "";
}
VISTAS.comprar = function () {
  var h = '<div class="tools"><input class="in" type="search" id="q" placeholder="🔎 Buscar plataforma o combo…" value="' + esc(BUSCA) + '" oninput="BUSCA=this.value;pintarProds()"></div><div id="prods"></div>';
  $("vista").innerHTML = h; pintarProds(); pintarBarra();
};
function pintarProds() {
  var q = norm(BUSCA).trim();
  var l = D.catalogo.filter(function (it) { return !q || q.split(/\s+/).every(function (w) { return norm(it.nombre + " " + (it.componentes || []).join(" ")).indexOf(w) !== -1; }); });
  l = l.slice().sort(function (a, b) { return (a.disponibles <= 0) - (b.disponibles <= 0) || (a.combo - b.combo) || a.nombre.localeCompare(b.nombre); });
  $("prods").innerHTML = l.length ? l.map(function (it) {
    var n = CARRO[it.id] || 0;
    return '<div class="card prod"><div><div class="n">' + (it.combo ? "🎁 " : "") + esc(it.nombre) + '</div>' +
      (it.combo ? '<div class="c">' + esc(it.componentes.join(" + ")) + '</div>' : '') +
      '<div class="c">' + (it.disponibles > 0 ? it.disponibles + " disponibles" : '<span class="neg">Agotado</span>') + '</div></div>' +
      '<div class="p"><b>' + pesos(it.precio) + '</b><s>' + pesos(it.publico) + '</s><div class="gan">ganas ' + pesos(it.publico - it.precio) + '</div></div>' +
      '<div></div><div class="qty">' + (n ? '<button onclick="cant(\'' + it.id + '\',-1)">−</button><b>' + n + '</b>' : '') +
      '<button onclick="cant(\'' + it.id + '\',1)"' + (n >= it.disponibles || n >= 10 ? " disabled" : "") + '>+</button></div></div>';
  }).join("") : '<div class="empty">No encontramos nada con esa búsqueda.</div>';
}
function cant(id, d) {
  var it = item(id); if (!it) return;
  var n = Math.max(0, Math.min(it.disponibles, 10, (CARRO[id] || 0) + d));
  if (n) CARRO[id] = n; else delete CARRO[id];
  pintarProds(); pintarBarra();
}
function abrirCompra() {
  var c = totalCarro();
  if (!c.n) return;
  var lineas = Object.keys(CARRO).map(function (id) { var it = item(id); return '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>' + CARRO[id] + ' × ' + esc(it.nombre) + '</span><b>' + pesos(it.precio * CARRO[id]) + '</b></div>'; }).join("");
  $("mCompraB").innerHTML = '<div class="row"><b style="font-size:18px">Confirmar compra</b><span class="sp"></span><button class="ibtn" onclick="cerrar(\'mCompra\')">✕</button></div>' + lineas +
    '<div class="row" style="justify-content:space-between;margin-top:10px;font-weight:800;font-size:18px"><span>Total</span><span>' + pesos(c.t) + '</span></div>' +
    '<div class="mut">Saldo ' + pesos(D.saldo) + ' → queda ' + (c.t > D.saldo ? '<span class="neg">' + pesos(D.saldo - c.t) + '</span>' : pesos(D.saldo - c.t)) + ' · si vendes al precio público ganas ' + pesos(c.g) + '</div>' +
    '<label class="f" for="cCli">Nombre de tu cliente</label><input class="in" id="cCli" maxlength="40" placeholder="Ej: Ana Gómez" autocomplete="off">' +
    '<div class="mut" style="margin-top:6px">Así lo ves en «Clientes» para renovarle. Nosotros no le escribimos a tu cliente.</div>' +
    (!D.cuota.al_dia ? '<div class="err">' + esc(D.cuota.texto) + '</div>' : '') +
    '<div class="err" id="cErr"></div>' +
    (c.t > D.saldo || !D.cuota.al_dia ? '<button class="btn full" style="margin-top:14px" onclick="cerrar(\'mCompra\');ir(\'recargar\')">Recargar saldo</button>' :
      '<button class="btn full" id="cBtn" style="margin-top:14px" onclick="comprar()">Comprar y recibir accesos</button>');
  abrir("mCompra");
  setTimeout(function () { var e = $("cCli"); if (e) e.focus(); }, 100);
}
function comprar() {
  var cli = $("cCli").value.trim();
  if (cli.length < 2) return $("cErr").textContent = "Escribe el nombre de tu cliente.";
  var b = $("cBtn"); b.disabled = true; b.textContent = "Comprando…"; $("cErr").textContent = "";
  var items = Object.keys(CARRO).map(function (id) { return { id: id, cant: CARRO[id] }; });
  api("rev_comprar", { cliente: cli, items: items }).then(function (r) {
    CARRO = {}; D.saldo = r.saldo; pintarSaldo(); pintarBarra();
    var msj = "¡Hola " + r.cliente.split(" ")[0] + "! 🎉 Estos son tus datos de acceso:\n\n" + r.accesos + "\n\nPor favor usa solo tu perfil. ¡A disfrutar! 🍿";
    CACHE_MSJ = msj;
    $("mCompraB").innerHTML = '<div class="row"><b style="font-size:18px">✅ Compra lista</b><span class="sp"></span><button class="ibtn" onclick="cerrar(\'mCompra\');cargar(true)">✕</button></div>' +
      '<div class="mut">' + r.entregados + (r.entregados === 1 ? " perfil entregado" : " perfiles entregados") + ' · ' + pesos(r.total) + ' del saldo · te queda ' + pesos(r.saldo) + '</div>' +
      (r.devuelto ? '<div class="err">Sin cupo para: ' + esc(r.fallos.join(", ")) + '. Te devolvimos ' + pesos(r.devuelto) + ' al saldo.</div>' : '') +
      (r.accesos ? '<pre class="acc">' + esc(msj) + '</pre><div class="row"><a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msj) + '">📲 Enviar por WhatsApp</a><button class="btn sec sm" onclick="copiar(CACHE_MSJ)">Copiar</button></div>' : '') +
      '<button class="btn sec full" style="margin-top:14px" onclick="cerrar(\'mCompra\');cargar(true)">Listo</button>';
  }).catch(function (e) { b.disabled = false; b.textContent = "Comprar y recibir accesos"; $("cErr").textContent = e.message; });
}
var CACHE_MSJ = "";

// ---------- Clientes ----------
function diasPill(d) {
  if (d === null || d === undefined) return '<span class="pill">sin fecha</span>';
  if (d < 0) return '<span class="pill bad">vencido hace ' + (-d) + ' d</span>';
  if (d === 0) return '<span class="pill bad">vence hoy</span>';
  if (d <= 3) return '<span class="pill warn">vence en ' + d + ' d</span>';
  return '<span class="pill ok">' + d + ' días</span>';
}
VISTAS.clientes = function () {
  var cl = D.clientes, grupos = {}, orden = [];
  cl.forEach(function (x) { if (!grupos[x.cliente]) { grupos[x.cliente] = []; orden.push(x.cliente); } grupos[x.cliente].push(x); });
  var h = '<div class="tools"><input class="in" type="search" id="qc" placeholder="🔎 Buscar cliente…" oninput="filtrarCli(this.value)"></div>' +
    '<div class="mut" style="margin:0 0 8px 2px">' + orden.length + ' clientes · ' + cl.length + ' perfiles. Marca los que quieres renovar (30 días, se paga con tu saldo).</div><div id="clis">' +
    (orden.length ? orden.map(function (n) {
      return '<div class="card" data-n="' + esc(norm(n)) + '"><b>' + esc(n) + '</b>' + grupos[n].map(function (x) {
        var id = "a" + x.fila;
        CACHE_ACC[id] = x.acceso;
        return '<div class="cli"><label class="chk"><input type="checkbox" data-f="' + x.fila + '"' + (SEL[x.fila] ? " checked" : "") + ' onchange="selCli(' + x.fila + ',this.checked)"><span style="flex:1">' +
          esc(x.plataforma) + ' · perfil ' + esc(x.perfil) + '<br><span class="mut">vence ' + esc(x.vence || "—") + ' · renovar ' + pesos(x.precio) + '</span></span>' + diasPill(x.dias) + '</label>' +
          '<div class="row" style="margin-top:6px"><button class="btn sec sm" onclick="copiar(CACHE_ACC[\'' + id + '\'])">Copiar datos</button><a class="btn sec sm" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(x.acceso) + '">📲 Enviar</a></div></div>';
      }).join("") + '</div>';
    }).join("") : '<div class="empty">Aún no tienes clientes. Compra tu primer perfil en 🛒 Comprar.</div>') + '</div>' +
    '<div id="renBox"></div>';
  $("vista").innerHTML = h; pintarRen();
};
var CACHE_ACC = {};
function filtrarCli(q) { q = norm(q).trim(); [].forEach.call(document.querySelectorAll("#clis .card"), function (c) { c.classList.toggle("oculto", !!q && c.getAttribute("data-n").indexOf(q) === -1); }); }
function selCli(f, on) { if (on) SEL[f] = 1; else delete SEL[f]; pintarRen(); }
function pintarRen() {
  var sel = D.clientes.filter(function (x) { return SEL[x.fila]; }), t = sel.reduce(function (a, x) { return a + x.precio; }, 0);
  $("renBox").innerHTML = sel.length ? '<div class="card" style="position:sticky;bottom:10px;border-color:var(--acc2)"><div class="row"><div><b>' + sel.length + (sel.length === 1 ? " perfil" : " perfiles") + ' · ' + pesos(t) + '</b><div class="mut">' +
    (t > D.saldo ? '<span class="neg">Saldo insuficiente (' + pesos(D.saldo) + ')</span>' : 'te queda ' + pesos(D.saldo - t)) + '</div></div><span class="sp"></span>' +
    (t > D.saldo || !D.cuota.al_dia ? '<button class="btn sm" onclick="ir(\'recargar\')">Recargar</button>' : '<button class="btn sm" id="rBtn" onclick="renovarSel()">Renovar 30 días</button>') + '</div><div class="err" id="rErr"></div></div>' : '';
}
function renovarSel() {
  var filas = Object.keys(SEL).map(Number);
  var b = $("rBtn"); b.disabled = true; b.textContent = "Renovando…";
  api("rev_renovar", { filas: filas }).then(function (r) {
    SEL = {}; toast("Renovado ✓");
    $("renBox").innerHTML = '<div class="card" style="border-color:var(--ok)"><b class="ok">✅ Renovado</b><div class="mut" style="margin-top:4px">' + r.renovados.map(function (x) { return esc(x.cliente) + ' · ' + esc(x.plataforma) + ' → vence ' + esc(x.vence); }).join("<br>") + '</div><div class="mut" style="margin-top:6px">Saldo: ' + pesos(r.saldo) + '</div></div>';
    setTimeout(function () { cargar(true); }, 1500);
  }).catch(function (e) { b.disabled = false; b.textContent = "Renovar 30 días"; $("rErr").textContent = e.message; });
}

// ---------- Recargar ----------
VISTAS.recargar = function () {
  var pend = D.recargas.filter(function (x) { return x.estado === "Pendiente"; })[0];
  var h = '<div class="card"><b>Recargar saldo</b><div class="mut" style="margin-top:4px">1) Transfiere a una de estas cuentas. 2) Escribe el valor y sube la captura. Lo cargamos apenas confirmemos el pago.</div>' +
    D.pagos.map(function (p) {
      var f = function (et, v) { return v ? '<div class="r"><span class="mut">' + et + '</span><b>' + esc(v) + '</b><button class="copy" onclick="copiar(\'' + esc(String(v).replace(/\s/g, "")) + '\')">Copiar</button></div>' : ""; };
      return '<div class="pay"><b>' + esc(p.metodo) + '</b>' + f("Número", p.numero) + f("Llave", p.llave) + '<div class="r"><span class="mut">Titular</span><b>' + esc(p.titular) + '</b><span></span></div></div>';
    }).join("") +
    (pend ? '<div class="err" style="color:var(--warn)">⏳ Ya tienes una recarga de ' + pesos(pend.monto) + ' en revisión. Espera a que la aprobemos para enviar otra.</div>' :
      '<label class="f" for="rMonto">Valor que transferiste</label><input class="in" id="rMonto" inputmode="numeric" placeholder="Mínimo ' + pesos(D.recargaMin) + '">' +
      '<input type="file" id="rFile" accept="image/*,application/pdf" class="oculto" onchange="leerArchivo(this)">' +
      '<div class="drop" id="rDrop" onclick="$(\'rFile\').click()">📎 Toca para subir la captura del pago<br><small>Imagen o PDF</small></div>' +
      '<div class="err" id="rcErr"></div><button class="btn full" id="rcBtn" style="margin-top:14px" onclick="recargar()">Enviar recarga</button>') +
    '<div class="mut" style="margin-top:12px">La plataforma cuesta ' + pesos(D.cuota.valor) + ' al mes y se descuenta de tu saldo. El saldo es para compras y renovaciones; no es reembolsable.</div></div>' +
    (D.recargas.length ? '<h2>Tus últimas recargas</h2><div class="card">' + D.recargas.map(function (x) {
      var cls = x.estado === "Aprobada" ? "ok" : x.estado === "Pendiente" ? "warn" : "bad";
      return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>' + esc(x.fecha) + '</span><span class="sp"></span><b>' + pesos(x.monto) + '</b><span class="pill ' + cls + '">' + esc(x.estado) + '</span></div>';
    }).join("") + '</div>' : '');
  $("vista").innerHTML = h;
};
function leerArchivo(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  var drop = $("rDrop");
  if (f.type === "application/pdf") {
    if (f.size > 5 * 1024 * 1024) return $("rcErr").textContent = "El PDF pesa más de 5 MB.";
    var rd = new FileReader();
    rd.onload = function () { COMP = { tipo: f.type, datos: String(rd.result).split(",")[1] }; drop.classList.add("has"); drop.innerHTML = "✅ " + esc(f.name) + "<br><small>Toca para cambiarlo</small>"; };
    rd.readAsDataURL(f); return;
  }
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    var data = c.toDataURL("image/jpeg", 0.82);
    COMP = { tipo: "image/jpeg", datos: data.split(",")[1] };
    drop.classList.add("has"); drop.innerHTML = "✅ Comprobante listo<br><img src=\"" + data + "\" alt=\"Comprobante\"><br><small>Toca para cambiarlo</small>";
    URL.revokeObjectURL(url);
  };
  img.onerror = function () { $("rcErr").textContent = "No pudimos leer esa imagen. Prueba con otra captura."; };
  img.src = url;
}
function recargar() {
  var monto = Number($("rMonto").value.replace(/\D/g, "")) || 0;
  if (monto < D.recargaMin) return $("rcErr").textContent = "La recarga mínima es " + pesos(D.recargaMin) + ".";
  if (!COMP) return $("rcErr").textContent = "Sube la captura de tu pago.";
  var b = $("rcBtn"); b.disabled = true; b.textContent = "Enviando…"; $("rcErr").textContent = "";
  api("rev_recarga", { monto: monto, comprobante: COMP }).then(function () {
    COMP = null; toast("Recarga enviada ✓"); cargar(true);
  }).catch(function (e) { b.disabled = false; b.textContent = "Enviar recarga"; $("rcErr").textContent = e.message; });
}

// ---------- Movimientos ----------
VISTAS.movs = function () {
  $("vista").innerHTML = '<div class="load">Cargando movimientos…</div>';
  api("rev_movimientos").then(function (r) {
    $("vista").innerHTML = '<div class="card" style="overflow-x:auto">' + (r.movimientos.length ? '<table><tr><th>Fecha</th><th>Movimiento</th><th style="text-align:right">Valor</th><th style="text-align:right">Saldo</th></tr>' +
      r.movimientos.map(function (m) {
        return '<tr><td class="mut">' + esc(m.fecha) + '</td><td><b>' + esc(m.tipo) + '</b><div class="mut">' + esc(m.detalle) + '</div></td><td class="m ' + (m.monto < 0 ? "neg" : "pos") + '">' + (m.monto > 0 ? "+" : "") + pesos(m.monto) + '</td><td class="m">' + pesos(m.saldo) + '</td></tr>';
      }).join("") + '</table>' : '<div class="empty">Aún no tienes movimientos.</div>') + '</div>' +
      '<div class="card"><b>Cambiar PIN</b><div class="row" style="margin-top:8px"><input class="in" type="password" id="pA" inputmode="numeric" maxlength="6" placeholder="PIN actual" style="flex:1;min-width:120px">' +
      '<input class="in" type="password" id="pN" inputmode="numeric" maxlength="6" placeholder="PIN nuevo (4-6)" style="flex:1;min-width:120px"><button class="btn sm" onclick="cambiarPin(this)">Guardar</button></div><div class="err" id="pErr"></div></div>';
  }).catch(function (e) { $("vista").innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; });
};
function cambiarPin(b) {
  b.disabled = true;
  api("rev_pin", { actual: $("pA").value, nuevo: $("pN").value }).then(function () { toast("PIN actualizado ✓"); $("pA").value = $("pN").value = ""; $("pErr").textContent = ""; })
    .catch(function (e) { $("pErr").textContent = e.message; }).then(function () { b.disabled = false; });
}

// ---------- Inicio ----------
(function () {
  try { var t = localStorage.getItem("st25_rev_tel"); if (t) $("lTel").value = t; } catch (e) {}
  var s = leerSes();
  if (!s) return;
  TOKEN = s; $("login").classList.add("oculto"); $("app").classList.remove("oculto"); cargar();
})();
</script>
