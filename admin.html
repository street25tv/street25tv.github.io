<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b12">
<title>Street25 · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--bg2:#12121c;--card:#171724;--line:#262636;--txt:#f3f3f7;--mut:#9a9ab0;--acc:#ff3d6e;--acc2:#7b5cff;--ok:#22c55e;--warn:#f59e0b;--rad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit}
a{color:#7dd3fc}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,18,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11px;border:1px solid var(--line);color:var(--mut);padding:2px 8px;border-radius:999px}
.hsp{flex:1}
.ibtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;cursor:pointer}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;position:relative;font-size:14px}
nav.tabs .ts{display:none}
@media (max-width:520px){nav.tabs{display:grid;grid-template-columns:repeat(3,1fr)}nav.tabs button{padding:8px 4px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}nav.tabs .tl{display:none}nav.tabs .ts{display:inline}}
nav.tabs button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
nav.tabs .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center}
nav.tabs button.on .b{background:#fff;color:var(--acc)}
main{padding-bottom:60px}
h2{font-size:18px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;cursor:default}
.kpi.click{cursor:pointer}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.kpi small{color:var(--mut);font-size:12px}
.kpi.alerta b{color:var(--acc)}.kpi.aviso b{color:var(--warn)}.kpi.bien b{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.pill.ok{color:var(--ok);border-color:rgba(34,197,94,.4)}.pill.warn{color:var(--warn);border-color:rgba(245,158,11,.4)}.pill.bad{color:var(--acc);border-color:rgba(255,61,110,.45)}
.btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;background:var(--acc2);color:#fff;text-decoration:none;display:inline-block}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn.ok{background:var(--ok);color:#06210f}.btn.bad{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btn.wa{background:#25d366;color:#05250f}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}
input.in,select.in{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;outline:none}
input.in:focus,select.in:focus{border-color:var(--acc2)}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 5px}
pre.acc{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font:inherit;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
.bar{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.load{color:var(--mut);padding:20px 0;text-align:center}
.err{color:var(--acc);font-size:14px;margin-top:8px}
.stats{white-space:pre-wrap;line-height:1.5;font-size:14px}
.msg{background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.35);border-radius:12px;padding:12px;margin-top:10px}
.msg pre{white-space:pre-wrap;font:inherit;font-size:13px;margin:6px 0 10px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lbox{width:100%;max-width:340px;text-align:center}
.lbox .logo{font-size:30px;margin-bottom:4px}
.dots{display:flex;justify-content:center;gap:14px;margin:26px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.pad button{height:62px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:22px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--line)}
.pad .x{font-size:15px;color:var(--mut)}
.lerr{min-height:22px;color:var(--acc);font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fgrid.big{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .fgrid .fk{background:var(--bg2)}
.fk{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;position:relative}
.fk small{display:block;color:var(--mut);font-size:12px}
.fk b{display:block;font-size:22px;font-weight:700;line-height:1.25;margin-top:2px}
.fk .fs{font-size:12px;margin-top:2px}
.delta{display:inline-block;font-size:12px;font-weight:600;margin-top:2px}
.delta.up{color:var(--ok)}.delta.down{color:var(--acc)}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-bottom:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative;width:100%;overflow:hidden}
.chart svg{display:block}
.chart .ax{fill:var(--mut);font-size:11px;font-family:Poppins,system-ui,sans-serif}
.tip{position:absolute;pointer-events:none;background:#fff;color:#111;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap;z-index:5}
.hbar{height:6px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:6px;max-width:220px}
.hbar i{display:block;height:100%;background:#8b7bff;border-radius:999px}
.neg{color:var(--acc);font-weight:600;white-space:nowrap}
td{white-space:nowrap}td:first-child{white-space:normal;min-width:118px;overflow-wrap:anywhere}.pill{white-space:nowrap}
@media (max-width:520px){table{font-size:12.5px}td,th{padding:7px 4px}}
tr.tot td{font-weight:700;border-bottom:0}
.chipf{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chipf.on{background:var(--acc2);border-color:transparent;color:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.f2{grid-template-columns:1fr;gap:0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px;font-size:14px}
.kv span{color:var(--mut)}.kv b{font-weight:500;overflow-wrap:anywhere}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.acc-form{margin-top:12px;border-color:var(--acc2)}
.mov{padding:8px 0;border-top:1px dashed var(--line)}.mov select{margin-top:6px}
input.pin{width:64px;padding:6px 6px;text-align:center}
.tp td{white-space:normal}.tp td:first-child{min-width:0;width:56px}.tp td:last-child{white-space:nowrap;width:1%}
.ptx{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--mut)}.ptx b{color:var(--txt)}
.vend{font-size:11px;color:var(--warn);white-space:nowrap}
.gimp{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:13.5px;line-height:1.5}
.gimp.warn{border-color:rgba(245,158,11,.45)}.gimp.bad{border-color:rgba(255,61,110,.5)}
.gopt{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14px}.gopt input{margin-top:3px}
.oculto{display:none!important}
textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;outline:none;font:inherit;font-size:14px;min-height:120px;resize:vertical}
textarea.in:focus{border-color:var(--acc2)}
.mc.env{opacity:.55}.mc .mprev{white-space:pre-wrap;font-size:13px;color:var(--mut);margin-top:8px;max-height:0;overflow:hidden;transition:max-height .2s}.mc.open .mprev{max-height:400px}
.cmp{margin-top:8px;font-size:13px;color:var(--warn)}
.pisow{margin-top:8px;font-size:13px;color:var(--acc)}
.pausa{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.45);border-radius:12px;padding:12px;margin:0 0 10px;font-size:14px}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.vars button{background:var(--bg2);border:1px dashed var(--line);color:var(--mut);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.cuenta{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.lin{display:grid;grid-template-columns:1fr 70px 110px 34px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:520px){.lin{grid-template-columns:1fr 56px 86px 30px}td,th{font-size:13px}}
.sw{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 auto;cursor:pointer}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .2s}.sw i:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{transform:translateX(20px)}.sw input:disabled+i{opacity:.5}
.card.apagado{opacity:.6}.chip.neg{color:var(--acc);border-color:rgba(255,61,110,.45)}
.plist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 10px 8px;background:var(--bg2)}
.calc{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;line-height:1.6}.calc:empty{display:none}
</style>
</head>
<body>

<section id="login">
  <div class="lbox">
    <div class="logo">STREET<span>25</span></div>
    <div class="mut">Panel administrativo</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="lerr" id="lerr"></div>
    <div class="pad" id="pad"></div>
  </div>
</section>

<section id="app" class="oculto">
  <header><div class="wrap">
    <div class="logo">STREET<span>25</span></div><span class="tag">Admin</span>
    <div class="hsp"></div>
    <button class="ibtn" onclick="recargar()" title="Actualizar">⟳</button>
    <button class="ibtn" onclick="salir()">Salir</button>
  </div></header>
  <main class="wrap">
    <nav class="tabs" id="tabs"></nav>
    <div id="vista"></div>
  </main>
</section>
<div class="toast" id="toast"></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzRPSLHYnZpNmhsGFux72vykDAjs8ORUZd1qDKn4gxAU16Xh4SqdxLItfl1jHOeC6hW/exec";
var TOKEN = "", PIN = "", VISTA = "resumen", CACHE = {};
var TABS = [
  ["resumen", "📊 Resumen"], ["finanzas", "💰 Finanzas"], ["pedidos", "🧾 Pedidos"], ["clientes", "👥 Clientes"], ["vender", "➕ Vender"], ["promos", "🎁 Combos y promos", "🎁 Promos"], ["revendedores", "🤝 Revendedores", "🤝 Socios"],
  ["vencimientos", "⏰ Vencimientos", "⏰ Vencen"], ["mensajes", "💬 Mensajes"], ["inventario", "📦 Inventario"], ["cuentas", "🏦 Cuentas madre", "🏦 Cuentas"], ["garantias", "🛡 Garantías"], ["ajustes", "⚙️ Ajustes"]
];

// ---------- Utilidades ----------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function pesos(n) { return "$" + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("show"); }, 1800); }
function copiar(t) {
  var ok = function () { toast("Copiado ✓"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { window.prompt("Copia:", t); });
  else window.prompt("Copia:", t);
}
// api.whatsapp.com conserva los emojis (wa.me los daña al redirigir)
function waUrl(tel, msj) { return "https://api.whatsapp.com/send?phone=57" + String(tel).replace(/\D/g, "").slice(-10) + (msj ? "&text=" + encodeURIComponent(msj) : ""); }
function guardarSes(v) { try { if (v) sessionStorage.setItem("st25_adm", v); else sessionStorage.removeItem("st25_adm"); } catch (e) {} }
function leerSes() { try { return sessionStorage.getItem("st25_adm") || ""; } catch (e) { return ""; } }
function diasTxt(d) {
  if (d === null || d === undefined) return '<span class="pill">sin fecha</span>';
  if (d < 0) return '<span class="pill bad">vencido hace ' + (-d) + ' d</span>';
  if (d === 0) return '<span class="pill bad">vence hoy</span>';
  if (d <= 3) return '<span class="pill warn">vence en ' + d + ' d</span>';
  return '<span class="pill ok">' + d + ' días</span>';
}
// Llamadas al servidor: siempre POST (el token nunca va en la dirección)
function api(accion, datos) {
  var cuerpo = Object.assign({ accion: accion, token: TOKEN }, datos || {});
  var intento = function (n) {
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(cuerpo) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(function (e) { if (n < 2 && /HTTP 4|HTTP 5|Failed|NetworkError|Load failed/i.test(String(e.message))) return new Promise(function (ok) { setTimeout(ok, 1500 * (n + 1)); }).then(function () { return intento(n + 1); }); throw e; });
  };
  return intento(0).then(function (r) {
    if (r && r.error === "SESION_VENCIDA") { cerrarSesion("Tu sesión venció. Entra de nuevo."); throw new Error("Sesión vencida"); }
    if (!r || r.error) throw new Error((r && r.error) || "Sin respuesta del servidor");
    return r;
  });
}
function msgBox(m, titulo) {
  if (!m || !m.msj) return "";
  var id = "m" + Math.random().toString(36).slice(2, 8);
  CACHE[id] = m.msj;
  return '<div class="msg"><b>' + esc(titulo || "Mensaje para el cliente") + '</b> <span class="mut">· ' + esc(m.tel) + '</span><pre>' + esc(m.msj) + '</pre>' +
    '<div class="row"><a class="btn wa sm" target="_blank" rel="noopener" href="' + esc(waUrl(m.tel, m.msj)) + '">📲 Enviar por WhatsApp</a>' +
    '<button class="btn sec sm" onclick="copiar(CACHE[\'' + id + '\'])">Copiar</button></div></div>';
}

// ---------- Ingreso ----------
function pintarPad() {
  var t = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "x", "0", "<"];
  $("pad").innerHTML = t.map(function (k) {
    if (k === "x") return '<button class="x" onclick="PIN=\'\';pintarDots()">Borrar</button>';
    if (k === "<") return '<button class="x" onclick="PIN=PIN.slice(0,-1);pintarDots()">⌫</button>';
    return '<button onclick="tecla(\'' + k + '\')">' + k + '</button>';
  }).join("");
}
function pintarDots() { var d = $("dots").children; for (var i = 0; i < d.length; i++) d[i].classList.toggle("on", i < PIN.length); }
function tecla(k) {
  if (PIN.length >= 4 || tecla.ocupado) return;
  PIN += k; pintarDots(); $("lerr").textContent = "";
  if (PIN.length === 4) entrar();
}
document.addEventListener("keydown", function (e) {
  if ($("login").classList.contains("oculto")) return;
  if (/^\d$/.test(e.key)) tecla(e.key);
  else if (e.key === "Backspace") { PIN = PIN.slice(0, -1); pintarDots(); }
});
function entrar() {
  tecla.ocupado = true; $("lerr").textContent = "Verificando…";
  api("adm_login", { pin: PIN }).then(function (r) {
    TOKEN = r.token; guardarSes(TOKEN); PIN = ""; pintarDots();
    $("login").classList.add("oculto"); $("app").classList.remove("oculto");
    ir("resumen");
  }).catch(function (e) {
    PIN = ""; pintarDots(); $("lerr").textContent = e.message;
    var b = $("dots"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  }).then(function () { tecla.ocupado = false; });
}
function cerrarSesion(t) {
  TOKEN = ""; guardarSes(""); $("app").classList.add("oculto"); $("login").classList.remove("oculto");
  $("lerr").textContent = t || ""; PIN = ""; pintarDots();
}
function salir() { var t = TOKEN; if (t) api("adm_salir", {}).catch(function () {}); cerrarSesion("Sesión cerrada."); }

// ---------- Navegación ----------
function pintarTabs(badges) {
  badges = badges || pintarTabs.b || {}; pintarTabs.b = badges;
  $("tabs").innerHTML = TABS.map(function (t) {
    var b = badges[t[0]] ? '<span class="b">' + badges[t[0]] + '</span>' : "";
    var et = t[2] ? '<span class="tl">' + t[1] + '</span><span class="ts">' + t[2] + '</span>' : t[1];
    return '<button class="' + (t[0] === VISTA ? "on" : "") + '" onclick="ir(\'' + t[0] + '\')">' + et + b + '</button>';
  }).join("");
}
function ir(v) { VISTA = v; pintarTabs(); window.scrollTo(0, 0); VISTAS[v](); }
function recargar() { ir(VISTA); }
function cargando(t) { $("vista").innerHTML = '<div class="load">' + esc(t || "Cargando…") + '</div>'; }
function fallo(e) { $("vista").innerHTML = '<div class="card"><div class="err">⚠️ ' + esc(e && e.message ? e.message : e) + '</div><button class="btn sec sm" style="margin-top:10px" onclick="recargar()">Reintentar</button></div>'; }

var VISTAS = {};

// ---------- Resumen ----------
VISTAS.resumen = function () {
  cargando();
  api("adm_resumen").then(function (r) {
    pintarTabs({ pedidos: r.pendientes, vencimientos: r.venceHoy + r.prox3 + r.vencidos });
    var k = function (n, t, cls, dest) { return '<div class="kpi ' + (cls || "") + (dest ? " click" : "") + '"' + (dest ? ' onclick="ir(\'' + dest + '\')"' : "") + '><b>' + n + '</b><small>' + t + '</small></div>'; };
    var h = '<h2>Hoy · <span class="mut">' + esc(r.hora) + '</span></h2><div class="grid">' +
      k(r.pendientes, "Pedidos por revisar", r.pendientes ? "alerta" : "bien", "pedidos") +
      k(r.venceHoy, "Vencen hoy", r.venceHoy ? "alerta" : "", "vencimientos") +
      k(r.prox3, "Vencen en 1–3 días", r.prox3 ? "aviso" : "", "vencimientos") +
      k(r.vencidos, "Vencidos sin renovar", r.vencidos ? "alerta" : "", "vencimientos") +

// Gráfico de barras en SVG: una o dos series, un solo eje, barras finas con punta redondeada, tooltip al pasar o tocar
function barras(id, datos, colores, tip, op) {
  op = op || {};
  var box = $(id); if (!box) return;
  var W = Math.max(280, box.clientWidth), H = 220, pl = 46, pr = 8, pt = 10, pb = 26;
  var max = 0; datos.forEach(function (d) { d.v.forEach(function (x) { if (x > max) max = x; }); });
  var paso = escalaPaso(max), top = Math.max(paso, Math.ceil(max / paso) * paso);
  var iw = W - pl - pr, ih = H - pt - pb, gw = iw / datos.length, ns = colores.length;
  var bw = Math.max(2, Math.min(18, (gw - 6) / ns - 2));
  var y = function (v) { return pt + ih - (v / top) * ih; };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="Gráfico de barras">';
  for (var g = 0; g <= top; g += paso) {
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (pl - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end" class="ax">' + corto(g) + '</text>';
  }
  datos.forEach(function (d, i) {
    var cx = pl + gw * i + gw / 2, x0 = cx - (bw * ns + 2 * (ns - 1)) / 2;
    if (op.marcar && d.clave === op.marcar) s += '<rect x="' + (pl + gw * i + 1) + '" y="' + pt + '" width="' + (gw - 2) + '" height="' + ih + '" rx="6" fill="rgba(255,255,255,.05)"/>';
    d.v.forEach(function (v, j) {
      if (v <= 0) return;
      var hgt = Math.max(2, ih - (y(v) - pt)), bx = x0 + j * (bw + 2), by = pt + ih - hgt, r = Math.min(4, bw / 2, hgt);
      s += '<path d="M' + bx + ',' + (pt + ih) + 'V' + (by + r) + 'Q' + bx + ',' + by + ' ' + (bx + r) + ',' + by + 'H' + (bx + bw - r) + 'Q' + (bx + bw) + ',' + by + ' ' + (bx + bw) + ',' + (by + r) + 'V' + (pt + ih) + 'Z" fill="' + colores[j] + '"/>';
    });
    var cada = op.cadaEt || Math.ceil(36 / gw);
    if (cada <= 1 || (datos.length - 1 - i) % cada === 0) s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" class="ax">' + esc(d.et) + '</text>';
    s += '<rect class="hit" data-i="' + i + '" x="' + (pl + gw * i) + '" y="' + pt + '" width="' + gw + '" height="' + (ih + pb) + '" fill="transparent"' + (op.alClic ? ' style="cursor:pointer"' : '') + '/>';
  });
  s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '" stroke="var(--mut)" stroke-opacity=".5"/></svg><div class="tip" style="display:none"></div>';
  box.innerHTML = s;
  var tipEl = box.querySelector(".tip");
  var mostrar = function (e) {
    var t = e.target; if (!t.classList || !t.classList.contains("hit")) { tipEl.style.display = "none"; return; }
    var d = datos[Number(t.getAttribute("data-i"))];
    tipEl.innerHTML = tip(d); tipEl.style.display = "block";
    var rb = box.getBoundingClientRect(), px = (e.touches ? e.touches[0].clientX : e.clientX) - rb.left;
    var tw = tipEl.offsetWidth; tipEl.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + "px"; tipEl.style.top = "0px";
  };
  box.addEventListener("mousemove", mostrar);
  box.addEventListener("mouseleave", function () { tipEl.style.display = "none"; });
  box.addEventListener("click", function (e) {
    mostrar(e);
    var t = e.target; if (op.alClic && t.classList && t.classList.contains("hit")) { var d = datos[Number(t.getAttribute("data-i"))]; if (d.clave !== op.marcar) op.alClic(d); }
  });
}
function escalaPaso(max) {
  if (max <= 0) return 10000;
  var bruto = max / 4, p = Math.pow(10, Math.floor(Math.log(bruto) / Math.LN10)), n = bruto / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

  $("vista").innerHTML = '<h2>Clientes</h2><div class="card"><input class="in" id="cq" placeholder="Buscar por nombre o WhatsApp" autocomplete="off" oninput="filtrarClientes()"></div><div id="clista"><div class="load">Cargando…</div></div>';
  api("adm_clientes", { q: "" }).then(function (r) { CACHE.clientes = r.clientes; filtrarClientes(); }).catch(function (e) { $("clista").innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
};
function normTxt(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function filtrarClientes() {
  var q = normTxt($("cq") ? $("cq").value.trim() : ""), qd = q.replace(/\D/g, "");
  var l = (CACHE.clientes || []).filter(function (c) { return !q || normTxt(c.nombre).indexOf(q) !== -1 || (qd.length >= 3 && c.contacto.indexOf(qd) !== -1); });
  $("clista").innerHTML = '<div class="mut" style="margin:0 0 8px 4px">' + l.length + ' clientes</div>' + (l.length ? l.map(function (c) {
    return '<div class="card" style="cursor:pointer" onclick="verCliente(\'' + esc(c.contacto) + '\')"><div class="row"><b>' + esc(c.nombre) + '</b><span class="sp"></span>' + diasTxt(c.minDias) + '</div>' +
      '<div class="mut" style="margin-top:4px">' + esc(c.contacto || "sin WhatsApp") + ' · ' + c.perfiles + (c.perfiles === 1 ? ' perfil' : ' perfiles') + ' · ' + esc(c.plataformas.join(", ")) + '</div></div>';
  }).join("") : '<div class="card empty">Sin resultados</div>');
}
function verCliente(tel, abrirComp) {
  if (!tel) return toast("Este cliente no tiene WhatsApp registrado");
  VISTA = "clientes"; pintarTabs(); window.scrollTo(0, 0);
  cargando("Cargando cliente…");
  api("adm_cliente", { contacto: tel }).then(function (c) {
    CACHE.cliente = c;
    var h = '<div class="row" style="margin-bottom:10px"><button class="btn sec sm" onclick="ir(\'clientes\')">← Clientes</button></div>' +
      '<div class="card"><div class="row"><h2 style="margin:0">' + esc(c.nombre) + '</h2><span class="sp"></span><a class="btn wa sm" target="_blank" rel="noopener" href="' + esc(waUrl(c.contacto)) + '">💬 ' + esc(c.contacto) + '</a></div>' +
      '<div class="row" style="margin-top:10px"><span class="mut">🔐 Código de acceso:</span> <b>' + (c.codigo ? esc(c.codigo) : "sin código") + '</b>' +
      '<button class="btn sec sm" onclick="enviarCodigo(\'' + esc(c.contacto) + '\')">' + (c.codigo ? "Enviar código" : "Crear y enviar código") + '</button></div>' +
      (c.saldo ? '<div class="mut" style="margin-top:6px">💳 Saldo por referidos: <b>' + pesos(c.saldo) + '</b></div>' : "") +
      '<div class="row" style="margin-top:10px" id="compCli"><span class="mut">🤝 Compromiso de pago:</span> ' +
      (c.perfiles.some(function (p) { return p.dias !== null && p.dias !== undefined && p.dias <= 3; }) ? '<button class="btn sec sm" onclick="compFormCli()">🤝 Registrar compromiso</button>' : '<span class="mut">nada por vencer</span>') + '</div>' +
      '<div class="res" id="compRes"></div>' +
      '<div id="cmsg"></div></div>' +
      '<h2 style="margin-top:16px">Perfiles (' + c.perfiles.length + ')</h2>' +
      c.perfiles.map(function (p) {
        return '<div class="card" id="f_' + p.fila + '"><div class="row"><b>' + esc(p.plataforma) + (p.tipo && !/normal/i.test(p.tipo) ? " " + esc(p.tipo) : "") + '</b><span class="mut">perfil ' + esc(p.perfil) + '</span><span class="sp"></span>' + diasTxt(p.dias) + '</div>' +
          (p.caida ? '<div class="err">⚠️ Cuenta madre marcada como caída</div>' : '') +
          precioTxt(p) +
          '<pre class="acc">' + esc(p.acceso) + '</pre>' +
          '<div class="row"><button class="btn sec sm" onclick="copiar(document.querySelector(\'#f_' + p.fila + ' pre\').textContent)">Copiar datos</button>' +
          '<a class="btn wa sm" target="_blank" rel="noopener" href="' + esc(waUrl(c.contacto, p.acceso)) + '">📲 Enviar datos</a>' +
          '<button class="btn sm" data-m="' + pesos(p.lista || p.precio) + '" onclick="renovarPerfil(' + p.fila + ',this)">🔄 Renovar 30 días' + ((p.lista || p.precio) ? " · " + pesos(p.lista || p.precio) : "") + '</button>' +
          (p.lista && p.precio && p.lista > p.precio ? '<span class="vend" title="Renueva al valor actual del perfil">antes ' + pesos(p.precio) + ' ↑</span>' : '') +
          '<button class="btn sec sm" onclick="garForm(' + p.fila + ')">🛡 Garantía</button>' +
          '<button class="btn bad sm" onclick="liberarPerfil(' + p.fila + ',this)">🔓 Liberar</button></div><div class="pisoi"></div><div class="cmpi"></div><div class="res"></div></div>';
      }).join("");
    $("vista").innerHTML = h;
    compMarcar(); pisoMarcar();
    if (abrirComp) compFormCli();
  }).catch(fallo);
}
function compMarcar() {
  api("adm_comp_lista").then(function (r) {
    CACHE.comp = r;
    var tel = CACHE.cliente && CACHE.cliente.contacto;
    r.activos.concat(r.incumplidos).forEach(function (c) {
      (c.items || [{ fila: c.fila, estado: c.estado }]).forEach(function (it) {
        if (it.estado !== "Activo" && it.estado !== "Incumplido") return;
        var e = $("f_" + it.fila); if (!e || !e.querySelector(".cmpi")) return;
        e.querySelector(".cmpi").innerHTML = '<div class="cmp">' + (it.estado === "Activo" ? '🤝 Compromiso' + (c.tipo === "Parcial" ? ' parcial' : '') + ' hasta el <b>' + esc(c.promete) + '</b> · no se libera solo' : '⚠️ No cumplió el compromiso del ' + esc(c.promete)) + (c.nota ? ' · ' + esc(c.nota) : '') + '</div>';
      });
      if (tel && c.tel === tel && c.estado === "Activo" && $("compCli")) {
        $("compCli").innerHTML = '<span class="mut">🤝 Compromiso de pago:</span> <span class="pill ok">' + (c.tipo === "Parcial" ? "parcial · " : "") + 'paga el ' + esc(c.promete) + ' · ' + pesos(c.valor) + '</span>' +
          '<button class="btn sec sm" onclick="compCancelar(\'' + esc(c.id) + '\',this)">Cancelar</button>';
      }
    });
  }).catch(function () {});
}
// Compromiso del cliente: agrupa sus perfiles vencidos o por vencer (≤3 días). Si solo marcas algunos porque pagó una parte, queda PARCIAL.
function compFormCli() {
  var c = CACHE.cliente; if (!c || !$("compRes")) return;
  var max = (CACHE.comp && CACHE.comp.max) || 7;
  var due = c.perfiles.filter(function (p) { return p.dias !== null && p.dias !== undefined && p.dias <= 3; });
  if (!due.length) return toast("Este cliente no tiene perfiles vencidos ni por vencer");
  CACHE.compDue = due;
  $("compRes").innerHTML = '<div class="card acc-form" style="margin-top:10px"><div class="row"><b>🤝 Compromiso de pago</b><span class="sp"></span><button class="btn sec sm" onclick="this.closest(\'.acc-form\').remove()">Cerrar</button></div>' +
    '<div class="mut" style="margin-top:4px">El compromiso es del cliente y cubre todos sus perfiles marcados. Si ya pagó alguno (renuévalo con 🔄), desmárcalo: el compromiso queda <b>parcial</b> por lo que falta. Máximo ' + max + ' días y uno a la vez.</div>' +
    due.map(function (p, i) {
      return '<label class="gopt"><input type="checkbox" data-ci="' + i + '" checked onchange="compTotal()"><span><b>' + esc(p.plataforma) + '</b> perfil ' + esc(p.perfil) + ' · ' + pesos(p.precio) + ' ' + diasTxt(p.dias) + '</span></label>';
    }).join("") +
    '<div class="gimp" id="compTot"></div>' +
    '<label class="f">¿Qué día promete pagar?</label><input class="in" type="date" id="compF" min="' + hoyISO(0) + '" max="' + hoyISO(max) + '" value="' + hoyISO(Math.min(3, max)) + '">' +
    '<label class="f">Nota (opcional)</label><input class="in" id="compN" maxlength="200" placeholder="Ej: le pagan el viernes">' +
    '<label class="gopt oculto" id="compX"><input type="checkbox" id="compXe"> Hacer una excepción (queda anotada en la hoja)</label>' +
    '<div class="err" id="compE"></div><div class="row" style="margin-top:10px"><button class="btn" onclick="compGuardarCli(this)">Guardar compromiso</button></div><div id="compOk"></div></div>';
  compTotal();
  $("compRes").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function compSel() { return [].filter.call(document.querySelectorAll("#compRes input[data-ci]"), function (x) { return x.checked; }).map(function (x) { return CACHE.compDue[Number(x.getAttribute("data-ci"))]; }); }
function compTotal() {
  var sel = compSel(), tot = sel.reduce(function (s, p) { return s + (p.precio || 0); }, 0), parcial = sel.length < CACHE.compDue.length;
  $("compTot").className = "gimp" + (parcial ? " warn" : "");
  $("compTot").innerHTML = sel.length ? '<b>' + (parcial ? "Compromiso PARCIAL" : "Compromiso total") + '</b> · ' + sel.length + (sel.length === 1 ? " perfil" : " perfiles") + ' · ' + pesos(tot) + ' por cobrar' +
    (parcial ? '<br><span class="mut">Los perfiles sin marcar no quedan protegidos: renuévalos si ya los pagó.</span>' : '') : 'Marca al menos un perfil.';
}
function compGuardarCli(b) {
  var sel = compSel(), f = $("compF").value, n = $("compN").value.trim();
  if (!sel.length) return $("compE").textContent = "Marca al menos un perfil.";
  if (!f) return $("compE").textContent = "Elige la fecha.";
  $("compE").textContent = ""; b.disabled = true; b.textContent = "Guardando…";
  var ex = $("compXe") && $("compXe").checked;
  api("adm_comp_crear", { filas: sel.map(function (p) { return p.fila; }), fecha: f, nota: n, excepcion: !!ex }).then(function (r) {
    b.textContent = "✓ Guardado";
    $("compOk").innerHTML = '<div style="margin-top:8px"><span class="pill ok">' + (r.tipo === "Parcial" ? "Compromiso parcial" : "Compromiso") + ' hasta el ' + esc(r.promete) + ' · ' + pesos(r.total) + '</span></div>' + msgBox(r.mensaje, "Confirmación para el cliente");
    toast("Compromiso guardado ✓"); compMarcar();
  }).catch(function (e) {
    b.disabled = false; b.textContent = "Guardar compromiso";
    var m = String(e.message || "");
    if (m.indexOf("INCUMPLIO:") === 0) { m = m.slice(10).trim(); $("compX").classList.remove("oculto"); }
    $("compE").textContent = m;
  });
}
function enviarCodigo(tel) {
  api("adm_codigo", { contacto: tel }).then(function (r) { $("cmsg").innerHTML = msgBox(r.mensaje, "Mensaje con el código"); }).catch(function (e) { $("cmsg").innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function renovarPerfil(fila, btn) {
  if (!confirm("¿Ya recibiste el pago" + (btn.getAttribute("data-m") ? " de " + btn.getAttribute("data-m") : "") + "? Se sumarán 30 días a este perfil y queda con el valor actual del perfil.")) return;
  btn.disabled = true; btn.textContent = "Renovando…";
  api("adm_renovar", { fila: fila }).then(function (r) {
    $("f_" + fila).querySelector(".res").innerHTML = '<div style="margin-top:8px"><span class="pill ok">Renovado · vence ' + esc(r.vence) + '</span></div>' + msgBox(r.mensaje);
    btn.textContent = "✓ Renovado"; toast("Renovado ✓");
  }).catch(function (e) { btn.disabled = false; btn.textContent = "🔄 Renovar 30 días"; $("f_" + fila).querySelector(".res").innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

function liberarPerfil(fila, btn) {
  var c = CACHE.cliente || {}, p = (c.perfiles || []).filter(function (x) { return x.fila === fila; })[0] || {};
  if (!confirm("¿Liberar el perfil " + (p.perfil || "") + " de " + (p.plataforma || "") + " de " + (c.nombre || "este cliente") + "?\n\nSe borra el cliente del perfil y queda disponible para vender. Queda registrado en Clientes Liberados.")) return;
  btn.disabled = true; btn.textContent = "Liberando…";
  var caja = $("f_" + fila);
  api("adm_liberar", { fila: fila }).then(function (r) {
    caja.querySelectorAll("button, a.btn").forEach(function (b) { if (b !== btn) b.classList.add("oculto"); });
    btn.textContent = "✓ Liberado"; toast("Perfil liberado ✓");
    caja.querySelector(".res").innerHTML = '<div style="margin-top:8px"><span class="pill ok">Perfil libre</span>' +
      (r.quedan ? ' <span class="mut">· al cliente le quedan ' + r.quedan + (r.quedan === 1 ? ' perfil' : ' perfiles') + '</span>' : ' <span class="mut">· el cliente ya no tiene perfiles</span>') + '</div>' +
      (r.mensaje ? msgBox(r.mensaje, "Aviso para el cliente (opcional)") : "");
  }).catch(function (e) { btn.disabled = false; btn.textContent = "🔓 Liberar"; caja.querySelector(".res").innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

// ---------- Vender ----------
VISTAS.vender = function () {
  cargando();
  Promise.all([api("adm_inventario"), api("adm_pisos").catch(function () { return null; })]).then(function (rr) {
    var r = rr[0]; CACHE.pisos = rr[1];
    CACHE.plats = r.plataformas.filter(function (p) { return p.libres > 0; });
    if (!CACHE.plats.length) { $("vista").innerHTML = '<h2>Nueva venta</h2><div class="card empty">No hay perfiles libres. Carga perfiles en el Inventario.</div>'; return; }
    $("vista").innerHTML = '<h2>Nueva venta</h2><div class="card">' +
      '<label class="f">Nombre del cliente</label><input class="in" id="vNom" maxlength="60" placeholder="Ej: Luis Carlos">' +
      '<label class="f">WhatsApp</label><input class="in" id="vWa" maxlength="13" inputmode="numeric" placeholder="Ej: 3001234567">' +
      '<label class="f">Perfiles <span class="mut">(cantidad y precio; deja el precio vacío para usar el del inventario)</span></label><div id="vLineas"></div>' +
      '<button class="btn sec sm" onclick="agregarLinea()">＋ Otra plataforma</button>' +
      '<div class="pisow" id="vPiso"></div><div class="err" id="vErr"></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="vBtn" onclick="vender()">Registrar venta</button><span class="mut">El sistema asigna los perfiles libres y arma el mensaje con los accesos y el código.</span></div>' +
      '<div id="vRes"></div></div>';
    agregarLinea();
  }).catch(fallo);
};
function agregarLinea() {
  var d = document.createElement("div"); d.className = "lin";
  d.innerHTML = '<select class="in" onchange="pisoRevisar()">' + CACHE.plats.map(function (p, i) { return '<option value="' + i + '">' + esc(p.plataforma) + ' (' + p.libres + ' libres)</option>'; }).join("") + '</select>' +
    '<input class="in" type="number" min="1" max="10" value="1">' +
    '<input class="in" inputmode="numeric" placeholder="Precio" oninput="pisoRevisar()">' +
    '<button class="btn sec sm" title="Quitar" onclick="this.parentNode.remove();pisoRevisar()">✕</button>';
  $("vLineas").appendChild(d);
}
// Piso de precio: lo que te cuesta cada perfil (costo de la cuenta madre ÷ sus perfiles).
function pisoBajos() {
  var pz = CACHE.pisos, out = [];
  if (!pz || !$("vLineas")) return out;
  [].forEach.call($("vLineas").querySelectorAll(".lin"), function (ln) {
    var c = ln.querySelectorAll(".in"), p = CACHE.plats[Number(c[0].value)], precio = Number(String(c[2].value).replace(/\D/g, "")) || 0;
    var piso = p ? pz.plataformas[p.plataforma] : 0;
    if (p && precio && piso && precio < piso) out.push({ plataforma: p.plataforma, precio: precio, piso: piso });
  });
  return out;
}
function pisoRevisar() {
  if (!$("vPiso")) return;
  var b = pisoBajos();
  $("vPiso").innerHTML = b.map(function (x) { return '⚠️ ' + esc(x.plataforma) + ' a ' + pesos(x.precio) + ' queda por debajo del costo del perfil (' + pesos(x.piso) + ').'; }).join("<br>");
}
function pisoMarcar() {
  api("adm_pisos").then(function (pz) {
    CACHE.pisos = pz;
    ((CACHE.cliente && CACHE.cliente.perfiles) || []).forEach(function (p) {
      var piso = pz.filas[p.fila], e = $("f_" + p.fila);
      if (!e || !piso || !p.precio || p.precio >= piso || !e.querySelector(".pisoi")) return;
      e.querySelector(".pisoi").innerHTML = '<div class="pisow">⚠️ Paga ' + pesos(p.precio) + ' y el perfil te cuesta ' + pesos(piso) + '. Este cliente te deja pérdida; considera subirle el precio al renovar.</div>';
    });
  }).catch(function () {});
}
function vender() {
  var nom = $("vNom").value.trim(), wa = $("vWa").value.replace(/\D/g, "");
  if (wa.length === 12 && wa.indexOf("57") === 0) wa = wa.slice(2);
  var err = function (t) { $("vErr").textContent = t; };
  if (nom.length < 2) return err("Escribe el nombre del cliente.");
  if (wa.length !== 10) return err("Escribe un WhatsApp de 10 dígitos.");
  var items = [], lineas = $("vLineas").querySelectorAll(".lin");
  for (var i = 0; i < lineas.length; i++) {
    var c = lineas[i].querySelectorAll(".in"), p = CACHE.plats[Number(c[0].value)], cant = Math.floor(Number(c[1].value) || 0);
    if (!p || cant < 1) continue;
    if (cant > p.libres) return err("Solo hay " + p.libres + " libres de " + p.plataforma + ".");
    items.push({ plataforma: p.base, tipo: p.tipo, cant: cant, precio: c[2].value.replace(/\D/g, "") });
  }
  if (!items.length) return err("Agrega al menos un perfil.");
  var bajos = pisoBajos();
  if (bajos.length && !confirm("⚠️ Precio por debajo del costo:\n\n" + bajos.map(function (x) { return "• " + x.plataforma + ": " + pesos(x.precio) + " (el perfil te cuesta " + pesos(x.piso) + ")"; }).join("\n") + "\n\nEse cliente te deja pérdida. ¿Vender de todas formas?")) return;
  if (!confirm("¿Registrar la venta a " + nom + " (" + wa + ")?")) return;
  err(""); var b = $("vBtn"); b.disabled = true; b.textContent = "Registrando…";
  api("adm_vender", { nombre: nom, contacto: wa, items: items }).then(function (r) {
    $("vRes").innerHTML = '<div style="margin-top:12px"><span class="pill ok">' + r.hechos + (r.hechos === 1 ? " perfil asignado" : " perfiles asignados") + '</span>' +
      (r.fallos.length ? ' <span class="pill bad">Sin cupo: ' + esc(r.fallos.join(", ")) + '</span>' : '') + '</div>' + msgBox(r.mensaje, "Bienvenida con accesos");
    b.textContent = "✓ Venta registrada"; toast("Venta registrada ✓");
  }).catch(function (e) { b.disabled = false; b.textContent = "Registrar venta"; err(e.message); });
}

// ---------- Vencimientos ----------
VISTAS.vencimientos = function () {
  cargando();
  Promise.all([api("adm_vencimientos"), api("adm_comp_lista").catch(function () { return null; })]).then(function (rr) {
    var r = rr[0], cp = rr[1]; CACHE.comp = cp;
    var cmpFila = {}; if (cp) cp.activos.forEach(function (c) { (c.items || [{ fila: c.fila, estado: "Activo" }]).forEach(function (it) { if (it.estado === "Activo") cmpFila[it.fila] = c; }); });
    var grupos = [["Vencidos (últimos 7 días)", function (c) { return c.minDias < 0; }], ["Vencen hoy", function (c) { return c.minDias === 0; }], ["Vencen en 1–3 días", function (c) { return c.minDias > 0; }]];
    var h = '<h2>Vencimientos</h2><div class="mut" style="margin:-6px 0 12px">Cada cliente trae su recordatorio listo. Toca “Enviar” y se abre WhatsApp con el mensaje.</div>';
    if (cp) h += compSeccion(cp);
    if (!r.clientes.length) h += '<div class="card empty">Nadie vence en los próximos 3 días 🎉</div>';
    grupos.forEach(function (g) {
      var l = r.clientes.filter(g[1]); if (!l.length) return;
      h += '<h2 style="margin-top:16px">' + g[0] + ' (' + l.length + ')</h2>' + l.map(function (c, i) {
        var id = "v" + g[0].length + "_" + i; CACHE[id] = c.mensaje ? c.mensaje.msj : "";
        return '<div class="card"><div class="row"><b>' + esc(c.nombre) + '</b><span class="mut">' + esc(c.contacto) + '</span><span class="sp"></span>' + diasTxt(c.minDias) + '</div>' +
          '<div class="chips">' + c.perfiles.map(function (p) { return '<span class="chip">' + esc(p.plataforma) + ' · perfil ' + esc(p.perfil) + ' · ' + esc(p.vence) + (cmpFila[p.fila] ? ' · 🤝 hasta ' + esc(cmpFila[p.fila].promete) : '') + '</span>'; }).join("") + '</div>' +
          (c.mensaje ? '<div class="row" style="margin-top:10px"><a class="btn wa sm" target="_blank" rel="noopener" href="' + esc(waUrl(c.mensaje.tel, c.mensaje.msj)) + '">📲 Enviar recordatorio</a>' +
            '<button class="btn sec sm" onclick="copiar(CACHE[\'' + id + '\'])">Copiar</button><button class="btn sec sm" onclick="verCliente(\'' + esc(c.contacto) + '\')">' + (c.minDias < 0 ? 'Renovar / liberar' : 'Ver / renovar') + '</button>' + (c.contacto && !c.perfiles.some(function (p) { return cmpFila[p.fila]; }) ? '<button class="btn sec sm" onclick="verCliente(\'' + esc(c.contacto) + '\', true)">🤝 Compromiso</button>' : '') + '</div>' : '<div class="mut">Sin WhatsApp</div>') + '</div>';
      }).join("");
    });
    $("vista").innerHTML = h;
  }).catch(fallo);
};

function compSeccion(cp) {
  if (!cp.activos.length && !cp.incumplidos.length && !cp.cumplidos.length) return "";
  var it = function (c, botones) {
    var id = "cm_" + c.id; CACHE[id] = c.mensaje ? c.mensaje.msj : "";
    return '<div class="card" id="ci_' + esc(c.id) + '"><div class="row"><b>' + esc(c.cliente) + '</b>' + (c.tipo === "Parcial" ? '<span class="pill warn">parcial</span>' : '') + '<span class="mut">' + esc(c.plataforma) + (c.valor ? ' · ' + pesos(c.valor) : '') + '</span><span class="sp"></span>' +

    '<div><label class="f">WhatsApp</label><input class="in" id="rvTel" inputmode="numeric" maxlength="13" value="' + esc(v ? v.tel : "") + '"></div></div>' +
    '<div class="f2"><div><label class="f">% de descuento sobre la tienda</label><input class="in" id="rvPct" inputmode="numeric" maxlength="2" value="' + (v ? v.pct : CACHE.rv.pctDef) + '" oninput="rvEj()"></div>' +
    '<div><label class="f">Estado</label><select class="in" id="rvEst"><option' + (!v || v.estado === "Activo" ? " selected" : "") + '>Activo</option><option' + (v && v.estado !== "Activo" ? " selected" : "") + '>Pausado</option></select></div></div>' +
    '<div class="calc" id="rvEj"></div>' +
    '<label class="f">Notas (opcional)</label><input class="in" id="rvNot" maxlength="200" value="' + esc(v ? v.notas : "") + '">' +
    (v ? '' : '<div class="mut" style="margin-top:8px">Se crea con un PIN de 4 números y te doy el mensaje de bienvenida para enviárselo por WhatsApp.</div>') +
    '<div class="err" id="rvErr"></div><div class="row" style="margin-top:12px"><button class="btn" id="rvBtn" onclick="rvGuardar(' + (v ? "'" + esc(v.codigo) + "'" : "''") + ')">' + (v ? "Guardar cambios" : "Crear revendedor") + '</button>' +
    '<button class="btn sec" onclick="$(\'rvForm\').innerHTML=\'\'">Cancelar</button></div></div>';
  rvEj();
  $("rvForm").scrollIntoView({ behavior: "smooth", block: "start" });
}
function rvEj() { var p = Number($("rvPct").value.replace(/\D/g, "")) || 0; $("rvEj").innerHTML = 'Ej.: un perfil de ' + pesos(15000) + ' en la tienda le queda en <b>' + pesos(Math.round(15000 * (100 - p) / 100 / 100) * 100) + '</b>. Revisa que siga por encima de tu costo.'; }
function rvGuardar(codigo) {
  var d = { codigo: codigo, nombre: $("rvNom").value.trim(), tel: $("rvTel").value, pct: $("rvPct").value.replace(/\D/g, ""), estado: $("rvEst").value, notas: $("rvNot").value };
  if (d.nombre.length < 3) return $("rvErr").textContent = "Escribe el nombre.";
  if (d.pct === "") return $("rvErr").textContent = "Escribe el % de descuento.";
  var b = $("rvBtn"); b.disabled = true; b.textContent = "Guardando…";
  api("adm_rev_guardar", d).then(function (r) {
    CACHE.rv = r.lista;
    rvPintar(r.mensaje ? '<div class="card" style="border-color:var(--ok)"><b>✅ Revendedor ' + esc(r.codigo) + ' creado · PIN ' + esc(r.pin) + '</b>' + msgBox(r.mensaje, "Mensaje de bienvenida") + '</div>' : '');
    toast("Guardado ✓");
  }).catch(function (e) { b.disabled = false; b.textContent = "Guardar"; $("rvErr").textContent = e.message; });
}
function rvPin(i, b) {
  var v = CACHE.rv.revendedores[i];
  if (!confirm("¿Crear un PIN nuevo para " + v.nombre + "? El anterior deja de funcionar.")) return;
  b.disabled = true;
  api("adm_rev_pin", { codigo: v.codigo }).then(function (r) { $("rv_" + i).innerHTML = '<div class="mut" style="margin-top:8px">PIN nuevo: <b>' + esc(r.pin) + '</b></div>' + msgBox(r.mensaje, "Mensaje con el PIN"); })
    .catch(function (e) { toast(e.message); }).then(function () { b.disabled = false; });
}
function rvAjusteForm(i) {
  var v = CACHE.rv.revendedores[i];
  $("rv_" + i).innerHTML = '<div class="card acc-form" style="margin-top:10px"><b>Mover saldo de ' + esc(v.nombre) + '</b> <span class="mut">(saldo ' + pesos(v.saldo) + ')</span>' +
    '<div class="f2"><div><label class="f">Tipo</label><select class="in" id="ajT' + i + '"><option value="Recarga">Recarga manual (pago recibido)</option><option value="Garantía">Garantía (devolver días no usados)</option><option value="Ajuste">Ajuste / corrección</option></select></div>' +
    '<div><label class="f">Valor (negativo para descontar)</label><input class="in" id="ajM' + i + '" inputmode="numeric" placeholder="Ej.: 20000 o -5000"></div></div>' +
    '<label class="f">Motivo</label><input class="in" id="ajR' + i + '" maxlength="160" placeholder="Queda en sus movimientos">' +
    '<div class="err" id="ajE' + i + '"></div><div class="row" style="margin-top:10px"><button class="btn sm" id="ajB' + i + '" onclick="rvAjuste(' + i + ')">Aplicar</button><button class="btn sec sm" onclick="$(\'rv_' + i + '\').innerHTML=\'\'">Cancelar</button></div></div>';
}
function rvAjuste(i) {
  var v = CACHE.rv.revendedores[i], m = $("ajM" + i).value.replace(/[^\d-]/g, ""), mot = $("ajR" + i).value.trim();
  if (!Number(m)) return $("ajE" + i).textContent = "Escribe el valor.";
  if (mot.length < 3) return $("ajE" + i).textContent = "Escribe el motivo.";
  if (!confirm((Number(m) > 0 ? "Sumar " : "Descontar ") + pesos(Math.abs(Number(m))) + " al saldo de " + v.nombre + "?")) return;
  var b = $("ajB" + i); b.disabled = true;
  api("adm_rev_ajuste", { codigo: v.codigo, monto: m, motivo: mot, tipo: $("ajT" + i).value }).then(function (r) { CACHE.rv = r.lista; rvPintar(); toast("Saldo actualizado: " + pesos(r.saldo)); })
    .catch(function (e) { b.disabled = false; $("ajE" + i).textContent = e.message; });
}
function rvRecarga(id, aprobar, b) {
  if (!aprobar && !confirm("¿Rechazar esta recarga?")) return;
  var caja = $("rc_" + id); caja.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
  api("adm_rev_recarga", { id: id, aprobar: aprobar }).then(function (r) {
    CACHE.rv = r.lista; rvPintar(msgBox(r.mensaje, r.estado === "Aprobada" ? "✅ Recarga cargada · mensaje para el revendedor" : "Mensaje para el revendedor")); toast(r.estado === "Aprobada" ? "Saldo cargado ✓" : "Recarga rechazada");
  }).catch(function (e) { caja.querySelectorAll("button").forEach(function (x) { x.disabled = false; }); caja.querySelector(".res").innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function rvMovs(i) {
  var v = CACHE.rv.revendedores[i], box = $("rv_" + i);
  box.innerHTML = '<div class="load">Cargando…</div>';
  api("adm_rev_movs", { codigo: v.codigo }).then(function (r) {
    box.innerHTML = '<div style="overflow-x:auto;margin-top:10px"><table class="tp"><tr><th>Fecha</th><th>Movimiento</th><th>Valor</th><th>Saldo</th></tr>' +
      (r.movimientos.length ? r.movimientos.map(function (m) { return '<tr><td class="mut">' + esc(m.fecha) + '</td><td><b>' + esc(m.tipo) + '</b><div class="mut">' + esc(m.detalle) + '</div></td><td class="' + (m.monto < 0 ? "neg" : "") + '">' + pesosS(m.monto) + '</td><td>' + pesos(m.saldo) + '</td></tr>'; }).join("") :
        '<tr><td colspan="4" class="mut">Sin movimientos</td></tr>') + '</table></div>' +
      (r.clientes.length ? '<div class="mut" style="margin-top:10px"><b>' + r.clientes.length + ' perfiles activos</b>: ' + r.clientes.map(function (c) { return esc(c.cliente) + ' (' + esc(c.plataforma) + ', ' + esc(c.vence) + ')'; }).join(" · ") + '</div>' : '') +
      '<button class="btn sec sm" style="margin-top:8px" onclick="$(\'rv_' + i + '\').innerHTML=\'\'">Cerrar</button>';
  }).catch(function (e) { box.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

VISTAS.ajustes = function () {
  $("vista").innerHTML = '<h2>Ajustes</h2><div class="card"><b>Cambiar PIN de ingreso</b>' +
    '<label class="f">PIN actual</label><input class="in" type="password" id="pA" inputmode="numeric" maxlength="8" autocomplete="current-password">' +
    '<label class="f">PIN nuevo (4 a 8 números)</label><input class="in" type="password" id="pN" inputmode="numeric" maxlength="8" autocomplete="new-password">' +
    '<label class="f">Repite el PIN nuevo</label><input class="in" type="password" id="pN2" inputmode="numeric" maxlength="8" autocomplete="new-password">' +
    '<div class="err" id="pErr"></div><button class="btn" style="margin-top:12px" onclick="cambiarPin(this)">Guardar PIN</button></div>' +
    '<div class="card"><b>Seguridad</b><div class="mut" style="margin-top:6px">• La sesión dura 6 horas y se renueva mientras uses el panel.<br>• Con 5 PIN errados el panel se bloquea 15 minutos y te llega aviso a Telegram.<br>• Cada ingreso se avisa en Telegram.<br>• Usa “Salir” si entras desde un celular o computador que no es tuyo.</div></div>';
};
function cambiarPin(b) {
  var a = $("pA").value.replace(/\D/g, ""), n = $("pN").value.replace(/\D/g, ""), n2 = $("pN2").value.replace(/\D/g, "");
  if (n !== n2) return $("pErr").textContent = "Los PIN nuevos no coinciden.";
  if (n.length < 4) return $("pErr").textContent = "El PIN nuevo debe tener al menos 4 números.";
  if (n.length !== 4) return $("pErr").textContent = "Por ahora el teclado de ingreso usa 4 números: elige un PIN de 4.";
  b.disabled = true;
  api("adm_pin", { actual: a, nuevo: n }).then(function () { $("pErr").textContent = ""; toast("PIN actualizado ✓"); $("pA").value = $("pN").value = $("pN2").value = ""; })
    .catch(function (e) { $("pErr").textContent = e.message; }).then(function () { b.disabled = false; });
}

// ---------- Inicio ----------
pintarPad(); pintarDots();
(function () {
  var t = leerSes();
  if (!t) return;
  TOKEN = t; $("login").classList.add("oculto"); $("app").classList.remove("oculto"); ir("resumen");
})();
</script>
</body>
