<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b12">
<title>Street25 · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--bg2:#12121c;--card:#171724;--line:#262636;--txt:#f3f3f7;--mut:#9a9ab0;--acc:#ff3d6e;--acc2:#7b5cff;--ok:#22c55e;--warn:#f59e0b;--rad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit}
a{color:#7dd3fc}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,18,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11px;border:1px solid var(--line);color:var(--mut);padding:2px 8px;border-radius:999px}
.hsp{flex:1}
.ibtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;cursor:pointer}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;position:relative;font-size:14px}
nav.tabs .ts{display:none}
@media (max-width:520px){nav.tabs{display:grid;grid-template-columns:repeat(3,1fr)}nav.tabs button{padding:8px 4px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}nav.tabs .tl{display:none}nav.tabs .ts{display:inline}}
nav.tabs button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
nav.tabs .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center}
nav.tabs button.on .b{background:#fff;color:var(--acc)}
main{padding-bottom:60px}
h2{font-size:18px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;cursor:default}
.kpi.click{cursor:pointer}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.kpi small{color:var(--mut);font-size:12px}
.kpi.alerta b{color:var(--acc)}.kpi.aviso b{color:var(--warn)}.kpi.bien b{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.pill.ok{color:var(--ok);border-color:rgba(34,197,94,.4)}.pill.warn{color:var(--warn);border-color:rgba(245,158,11,.4)}.pill.bad{color:var(--acc);border-color:rgba(255,61,110,.45)}
.btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;background:var(--acc2);color:#fff;text-decoration:none;display:inline-block}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn.ok{background:var(--ok);color:#06210f}.btn.bad{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btn.wa{background:#25d366;color:#05250f}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}
input.in,select.in{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;outline:none}
input.in:focus,select.in:focus{border-color:var(--acc2)}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 5px}
pre.acc{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font:inherit;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
.bar{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.load{color:var(--mut);padding:20px 0;text-align:center}
.err{color:var(--acc);font-size:14px;margin-top:8px}
.stats{white-space:pre-wrap;line-height:1.5;font-size:14px}
.msg{background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.35);border-radius:12px;padding:12px;margin-top:10px}
.msg pre{white-space:pre-wrap;font:inherit;font-size:13px;margin:6px 0 10px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lbox{width:100%;max-width:340px;text-align:center}
.lbox .logo{font-size:30px;margin-bottom:4px}
.dots{display:flex;justify-content:center;gap:14px;margin:26px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.pad button{height:62px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:22px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--line)}
.pad .x{font-size:15px;color:var(--mut)}
.lerr{min-height:22px;color:var(--acc);font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fgrid.big{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .fgrid .fk{background:var(--bg2)}
.fk{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;position:relative}
.fk small{display:block;color:var(--mut);font-size:12px}
.fk b{display:block;font-size:22px;font-weight:700;line-height:1.25;margin-top:2px}
.fk .fs{font-size:12px;margin-top:2px}
.delta{display:inline-block;font-size:12px;font-weight:600;margin-top:2px}
.delta.up{color:var(--ok)}.delta.down{color:var(--acc)}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-bottom:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative;width:100%;overflow:hidden}
.chart svg{display:block}
.chart .ax{fill:var(--mut);font-size:11px;font-family:Poppins,system-ui,sans-serif}
.tip{position:absolute;pointer-events:none;background:#fff;color:#111;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap;z-index:5}
.hbar{height:6px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:6px;max-width:220px}
.hbar i{display:block;height:100%;background:#8b7bff;border-radius:999px}
.neg{color:var(--acc);font-weight:600;white-space:nowrap}
td{white-space:nowrap}td:first-child{white-space:normal;min-width:118px;overflow-wrap:anywhere}.pill{white-space:nowrap}
@media (max-width:520px){table{font-size:12.5px}td,th{padding:7px 4px}}
tr.tot td{font-weight:700;border-bottom:0}
.chipf{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chipf.on{background:var(--acc2);border-color:transparent;color:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.f2{grid-template-columns:1fr;gap:0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px;font-size:14px}
.kv span{color:var(--mut)}.kv b{font-weight:500;overflow-wrap:anywhere}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.acc-form{margin-top:12px;border-color:var(--acc2)}
.mov{padding:8px 0;border-top:1px dashed var(--line)}.mov select{margin-top:6px}
input.pin{width:64px;padding:6px 6px;text-align:center}
.tp td{white-space:normal}.tp td:first-child{min-width:0;width:56px}.tp td:last-child{white-space:nowrap;width:1%}
.ptx{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--mut)}.ptx b{color:var(--txt)}
.vend{font-size:11px;color:var(--warn);white-space:nowrap}
.gimp{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:13.5px;line-height:1.5}
.gimp.warn{border-color:rgba(245,158,11,.45)}.gimp.bad{border-color:rgba(255,61,110,.5)}
.gopt{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14px}.gopt input{margin-top:3px}
.oculto{display:none!important}
textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;outline:none;font:inherit;font-size:14px;min-height:120px;resize:vertical}
textarea.in:focus{border-color:var(--acc2)}
.mc.env{opacity:.55}.mc .mprev{white-space:pre-wrap;font-size:13px;color:var(--mut);margin-top:8px;max-height:0;overflow:hidden;transition:max-height .2s}.mc.open .mprev{max-height:400px}
.cmp{margin-top:8px;font-size:13px;color:var(--warn)}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.vars button{background:var(--bg2);border:1px dashed var(--line);color:var(--mut);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.cuenta{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.lin{display:grid;grid-template-columns:1fr 70px 110px 34px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:520px){.lin{grid-template-columns:1fr 56px 86px 30px}td,th{font-size:13px}}
</style>
</head>
<body>

<section id="login">
  <div class="lbox">
    <div class="logo">STREET<span>25</span></div>
    <div class="mut">Panel administrativo</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="lerr" id="lerr"></div>
    <div class="pad" id="pad"></div>
  </div>
</section>

<section id="app" class="oculto">
  <header><div class="wrap">
    <div class="logo">STREET<span>25</span></div><span class="tag">Admin</span>
    <div class="hsp"></div>
    <button class="ibtn" onclick="recargar()" title="Actualizar">⟳</button>
    <button class="ibtn" onclick="salir()">Salir</button>
  </div></header>
  <main class="wrap">
    <nav class="tabs" id="tabs"></nav>
    <div id="vista"></div>
  </main>
</section>
<div class="toast" id="toast"></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzRPSLHYnZpNmhsGFux72vykDAjs8ORUZd1qDKn4gxAU16Xh4SqdxLItfl1jHOeC6hW/exec";
var TOKEN = "", PIN = "", VISTA = "resumen", CACHE = {};
var TABS = [
  ["resumen", "📊 Resumen"], ["finanzas", "💰 Finanzas"], ["pedidos", "🧾 Pedidos"], ["clientes", "👥 Clientes"], ["vender", "➕ Vender"],
  ["vencimientos", "⏰ Vencimientos", "⏰ Vencen"], ["mensajes", "💬 Mensajes"], ["inventario", "📦 Inventario"], ["cuentas", "🏦 Cuentas madre", "🏦 Cuentas"], ["garantias", "🛡 Garantías"], ["ajustes", "⚙️ Ajustes"]
];

// ---------- Utilidades ----------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function pesos(n) { return "$" + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("show"); }, 1800); }
function copiar(t) {
  var ok = function () { toast("Copiado ✓"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { window.prompt("Copia:", t); });
  else window.prompt("Copia:", t);
}
function waUrl(tel, msj) { return "https://wa.me/57" + String(tel).replace(/\D/g, "").slice(-10) + (msj ? "?text=" + encodeURIComponent(msj) : ""); }
function guardarSes(v) { try { if (v) sessionStorage.setItem("st25_adm", v); else sessionStorage.removeItem("st25_adm"); } catch (e) {} }
function leerSes() { try { return sessionStorage.getItem("st25_adm") || ""; } catch (e) { return ""; } }
function diasTxt(d) {
  if (d === null || d === undefined) return '<span class="pill">sin fecha</span>';
  if (d < 0) return '<span class="pill bad">vencido hace ' + (-d) + ' d</span>';
  if (d === 0) return '<span class="pill bad">vence hoy</span>';
  if (d <= 3) return '<span class="pill warn">vence en ' + d + ' d</span>';
  return '<span class="pill ok">' + d + ' días</span>';
}
// Llamadas al servidor: siempre POST (el token nunca va en la dirección)
function api(accion, datos) {
  var cuerpo = Object.assign({ accion: accion, token: TOKEN }, datos || {});
  var intento = function (n) {
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(cuerpo) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(function (e) { if (n < 2 && /HTTP 4|HTTP 5|Failed|NetworkError|Load failed/i.test(String(e.message))) return new Promise(function (ok) { setTimeout(ok, 1500 * (n + 1)); }).then(function () { return intento(n + 1); }); throw e; });
  };
  return intento(0).then(function (r) {
    if (r && r.error === "SESION_VENCIDA") { cerrarSesion("Tu sesión venció. Entra de nuevo."); throw new Error("Sesión vencida"); }
    if (!r || r.error) throw new Error((r && r.error) || "Sin respuesta del servidor");
    return r;
  });
}
function msgBox(m, titulo) {
  if (!m || !m.msj) return "";
  var id = "m" + Math.random().toString(36).slice(2, 8);
  CACHE[id] = m.msj;
  return '<div class="msg"><b>' + esc(titulo || "Mensaje para el cliente") + '</b> <span class="mut">· ' + esc(m.tel) + '</span><pre>' + esc(m.msj) + '</pre>' +
    '<div class="row"><a class="btn wa sm" target="_blank" rel="noopener" href="' + esc(waUrl(m.tel, m.msj)) + '">📲 Enviar por WhatsApp</a>' +
    '<button class="btn sec sm" onclick="copiar(CACHE[\'' + id + '\'])">Copiar</button></div></div>';
}

// ---------- Ingreso ----------
function pintarPad() {
  var t = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "x", "0", "<"];
  $("pad").innerHTML = t.map(function (k) {
    if (k === "x") return '<button class="x" onclick="PIN=\'\';pintarDots()">Borrar</button>';
    if (k === "<") return '<button class="x" onclick="PIN=PIN.slice(0,-1);pintarDots()">⌫</button>';
    return '<button onclick="tecla(\'' + k + '\')">' + k + '</button>';
  }).join("");
}
function pintarDots() { var d = $("dots").children; for (var i = 0; i < d.length; i++) d[i].classList.toggle("on", i < PIN.length); }
function tecla(k) {
  if (PIN.length >= 4 || tecla.ocupado) return;
  PIN += k; pintarDots(); $("lerr").textContent = "";
  if (PIN.length === 4) entrar();
}
document.addEventListener("keydown", function (e) {
  if ($("login").classList.contains("oculto")) return;
  if (/^\d$/.test(e.key)) tecla(e.key);
  else if (e.key === "Backspace") { PIN = PIN.slice(0, -1); pintarDots(); }
});
function entrar() {
  tecla.ocupado = true; $("lerr").textContent = "Verificando…";
  api("adm_login", { pin: PIN }).then(function (r) {
    TOKEN = r.token; guardarSes(TOKEN); PIN = ""; pintarDots();
    $("login").classList.add("oculto"); $("app").classList.remove("oculto");
    ir("resumen");
  }).catch(function (e) {
    PIN = ""; pintarDots(); $("lerr").textContent = e.message;
    var b = $("dots"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  }).then(function () { tecla.ocupado = false; });
}
function cerrarSesion(t) {
  TOKEN = ""; guardarSes(""); $("app").classList.add("oculto"); $("login").classList.remove("oculto");
  $("lerr").textContent = t || ""; PIN = ""; pintarDots();
}
function salir() { var t = TOKEN; if (t) api("adm_salir", {}).catch(function () {}); cerrarSesion("Sesión cerrada."); }

// ---------- Navegación ----------
function pintarTabs(badges) {
  badges = badges || pintarTabs.b || {}; pintarTabs.b = badges;
  $("tabs").innerHTML = TABS.map(function (t) {
    var b = badges[t[0]] ? '<span class="b">' + badges[t[0]] + '</span>' : "";
    var et = t[2] ? '<span class="tl">' + t[1] + '</span><span class="ts">' + t[2] + '</span>' : t[1];
    return '<button class="' + (t[0] === VISTA ? "on" : "") + '" onclick="ir(\'' + t[0] + '\')">' + et + b + '</button>';
  }).join("");
}
function ir(v) { VISTA = v; pintarTabs(); window.scrollTo(0, 0); VISTAS[v](); }
function recargar() { ir(VISTA); }
function cargando(t) { $("vista").innerHTML = '<div class="load">' + esc(t || "Cargando…") + '</div>'; }
function fallo(e) { $("vista").innerHTML = '<div class="card"><div class="err">⚠️ ' + esc(e && e.message ? e.message : e) + '</div><button class="btn sec sm" style="margin-top:10px" onclick="recargar()">Reintentar</button></div>'; }

var VISTAS = {};

// ---------- Resumen ----------
VISTAS.resumen = function () {
  cargando();
  api("adm_resumen").then(function (r) {
    pintarTabs({ pedidos: r.pendientes, vencimientos: r.venceHoy + r.prox3 + r.vencidos });
    var k = function (n, t, cls, dest) { return '<div class="kpi ' + (cls || "") + (dest ? " click" : "") + '"' + (dest ? ' onclick="ir(\'' + dest + '\')"' : "") + '><b>' + n + '</b><small>' + t + '</small></div>'; };
    var h = '<h2>Hoy · <span class="mut">' + esc(r.hora) + '</span></h2><div class="grid">' +
      k(r.pendientes, "Pedidos por revisar", r.pendientes ? "alerta" : "bien", "pedidos") +
      k(r.venceHoy, "Vencen hoy", r.venceHoy ? "alerta" : "", "vencimientos") +
      k(r.prox3, "Vencen en 1–3 días", r.prox3 ? "aviso" : "", "vencimientos") +
      k(r.vencidos, "Vencidos sin renovar", r.vencidos ? "alerta" : "", "vencimientos") +
      k(r.clientes, "Clientes activos", "", "clientes") +
      k(r.activos, "Perfiles vendidos", "", "clientes") +
      k(r.libres, "Perfiles libres", r.libres ? "bien" : "alerta", "inventario") +
      k(r.cmPorVencer, "Cuentas madre por vencer (≤5 d)", r.cmPorVencer ? "aviso" : "", "cuentas") +
      (r.cmCaidas ? k(r.cmCaidas, "Cuentas madre caídas", "alerta", "cuentas") : "") +
      '</div><h2 style="margin-top:20px">Ocupación por plataforma</h2><div class="card">' +
      r.plataformas.map(function (p) {
        var tot = p.libres + p.ocupados, pct = tot ? Math.round(p.ocupados * 100 / tot) : 0;
        return '<div style="margin-bottom:12px"><div class="row"><b>' + esc(p.plataforma) + '</b><span class="sp"></span><span class="mut">' + p.ocupados + '/' + tot + ' vendidos · </span>' +
          (p.libres ? '<span class="pill ok">' + p.libres + ' libres</span>' : '<span class="pill bad">agotado</span>') + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
      }).join("") + '</div><h2 style="margin-top:20px">Finanzas del mes</h2><div class="card kpi click" onclick="ir(\'finanzas\')" id="finMini"><span class="mut">Cargando…</span></div>';
    $("vista").innerHTML = h;
    api("adm_finanzas", {}).then(function (f) {

// Gráfico de barras en SVG: una o dos series, un solo eje, barras finas con punta redondeada, tooltip al pasar o tocar
function barras(id, datos, colores, tip, op) {
  op = op || {};
  var box = $(id); if (!box) return;
  var W = Math.max(280, box.clientWidth), H = 220, pl = 46, pr = 8, pt = 10, pb = 26;
  var max = 0; datos.forEach(function (d) { d.v.forEach(function (x) { if (x > max) max = x; }); });
  var paso = escalaPaso(max), top = Math.max(paso, Math.ceil(max / paso) * paso);
  var iw = W - pl - pr, ih = H - pt - pb, gw = iw / datos.length, ns = colores.length;
  var bw = Math.max(2, Math.min(18, (gw - 6) / ns - 2));
  var y = function (v) { return pt + ih - (v / top) * ih; };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="Gráfico de barras">';
  for (var g = 0; g <= top; g += paso) {
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (pl - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end" class="ax">' + corto(g) + '</text>';
  }
  datos.forEach(function (d, i) {
    var cx = pl + gw * i + gw / 2, x0 = cx - (bw * ns + 2 * (ns - 1)) / 2;

    d.v.forEach(function (v, j) {
      if (v <= 0) return;

      s += '<path d="M' + bx + ',' + (pt + ih) + 'V' + (by + r) + 'Q' + bx + ',' + by + ' ' + (bx + r) + ',' + by + 'H' + (bx + bw - r) + 'Q' + (bx + bw) + ',' + by + ' ' + (bx + bw) + ',' + (by + r) + 'V' + (pt + ih) + 'Z" fill="' + colores[j] + '"/>';
    });
    var cada = op.cadaEt || Math.ceil(36 / gw);
    if (cada <= 1 || (datos.length - 1 - i) % cada === 0) s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" class="ax">' + esc(d.et) + '</text>';
    s += '<rect class="hit" data-i="' + i + '" x="' + (pl + gw * i) + '" y="' + pt + '" width="' + gw + '" height="' + (ih + pb) + '" fill="transparent"' + (op.alClic ? ' style="cursor:pointer"' : '') + '/>';
  });
  s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '" stroke="var(--mut)" stroke-opacity=".5"/></svg><div class="tip" style="display:none"></div>';
  box.innerHTML = s;
  var tipEl = box.querySelector(".tip");
  var mostrar = function (e) {
    var t = e.target; if (!t.classList || !t.classList.contains("hit")) { tipEl.style.display = "none"; return; }
    var d = datos[Number(t.getAttribute("data-i"))];
    tipEl.innerHTML = tip(d); tipEl.style.display = "block";
    var rb = box.getBoundingClientRect(), px = (e.touches ? e.touches[0].clientX : e.clientX) - rb.left;
    var tw = tipEl.offsetWidth; tipEl.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + "px"; tipEl.style.top = "0px";
  };
  box.addEventListener("mousemove", mostrar);
  box.addEventListener("mouseleave", function () { tipEl.style.display = "none"; });
  box.addEventListener("click", function (e) {
    mostrar(e);
    var t = e.target; if (op.alClic && t.classList && t.classList.contains("hit")) { var d = datos[Number(t.getAttribute("data-i"))]; if (d.clave !== op.marcar) op.alClic(d); }
  });
}

  if (max <= 0) return 10000;
  var bruto = max / 4, p = Math.pow(10, Math.floor(Math.log(bruto) / Math.LN10)), n = bruto / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

    '<div class="mut" style="margin-top:8px">Se numeran después del último perfil y toman el correo y la contraseña de la cuenta.</div>', "Agregar perfiles", "agregarCm()");
  else if (tipo === "mover" || tipo === "caida") {
    var ocup = r.perfiles.filter(function (p) { return p.cliente && !p.bloqueado; }), usados = {};
    var filas = ocup.map(function (p) {
      var auto = ""; r.libres.forEach(function (l) { if (!auto && !usados[l.fila]) auto = l.fila; }); if (auto && tipo === "caida") usados[auto] = 1; else auto = "";
      return '<div class="mov"><div>👤 <b>' + esc(p.cliente) + '</b> <span class="mut">perfil ' + esc(p.perfil) + ' · vence ' + esc(p.vence) + '</span></div><select class="in" data-from="' + p.fila + '"><option value="">— No mover —</option>' +
        r.libres.map(function (l) { return '<option value="' + l.fila + '"' + (String(l.fila) === String(auto) ? " selected" : "") + '>→ ' + esc(l.cuenta) + ' · perfil ' + esc(l.perfil) + ' (' + esc(l.nombre) + ')</option>'; }).join("") + '</select></div>';
    }).join("");
    var cuerpo = (ocup.length ? '<div class="mut" style="margin:6px 0 10px">' + ocup.length + ' cliente(s) en esta cuenta · ' + r.libres.length + ' perfiles libres de ' + esc(c.plataforma) + ' en otras cuentas.</div>' + filas : '<div class="mut" style="margin-top:8px">Esta cuenta no tiene clientes.</div>') +
      (ocup.length && !r.libres.length ? '<div class="err">⚠️ No hay perfiles libres de ' + esc(c.plataforma) + ' en otras cuentas. Crea o agrega perfiles primero.</div>' : '') +
      '<label class="chk" style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="aMarcar"' + (tipo === "caida" ? " checked" : "") + '> Marcar ' + esc(c.id) + ' como CAÍDA (deja de venderse)</label>' +
      '<div class="mut" style="margin-top:6px">Cada cliente movido conserva su fecha de vencimiento y te dejo su mensaje con los datos nuevos.</div>';
    h = form(tipo === "caida" ? "🚨 Cuenta caída" : "🔄 Mover clientes a otra cuenta", cuerpo, tipo === "caida" ? "Procesar cuenta caída" : "Mover clientes", "caidaCm()", tipo === "caida" ? "bad" : "");
  } else if (tipo === "eliminar") h = form("🗑 Eliminar cuenta",
    (r.resumen.ocupados ? '<div class="err">Esta cuenta tiene ' + r.resumen.ocupados + ' cliente(s). Muévelos primero con “Mover clientes”.</div>' : '') +
    '<div class="mut" style="margin-top:8px">Se borran la cuenta y sus ' + r.perfiles.length + ' perfiles del Inventario. Esto no se puede deshacer. Escribe el ID para confirmar:</div><input class="in" id="aConf" placeholder="' + esc(c.id) + '" style="margin-top:8px">', "Eliminar definitivamente", "eliminarCm()", "bad");
  box.innerHTML = h;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}
function accEnviar(accion, datos, ok) {
  var b = $("aBtn"), txt = b.textContent, err = function (t) { $("aErr").textContent = t; };
  err(""); b.disabled = true; b.textContent = "Procesando…";
  return api(accion, datos).then(function (r) { b.textContent = "✓ Listo"; ok(r); }).catch(function (e) { b.disabled = false; b.textContent = txt; err(e.message); });
}
function renovarCm() {
  var c = CACHE.cm.cuenta, monto = $("aMonto").value.replace(/\D/g, "");
  if (!monto) return $("aErr").textContent = "Escribe el monto pagado.";
  if (!confirm("¿Registrar pago de " + pesos(monto) + " y sumar " + $("aDias").value + " días a " + c.id + "?")) return;
  accEnviar("adm_cm_renovar", { id: c.id, dias: $("aDias").value, monto: monto, fecha: $("aFecha").value }, function (r) { toast("Cuenta renovada ✓"); verCm(c.id); });
}
function credCm() {
  var c = CACHE.cm.cuenta, co = $("aCo").value.trim(), cl = $("aCl").value.trim();
  if (!co || !cl) return $("aErr").textContent = "Escribe el correo y la contraseña.";
  if (!confirm("¿Cambiar el acceso de " + c.id + " en sus " + CACHE.cm.perfiles.length + " perfiles?")) return;
  accEnviar("adm_cm_cred", { id: c.id, correo: co, clave: cl }, function (r) {
    $("aRes").innerHTML = '<div style="margin-top:10px"><span class="pill ok">' + r.perfiles + ' perfiles actualizados</span></div>' + msgLista(r.mensajes, "Avisa a tus clientes");
    CACHE.cm.cuenta.correo = co; CACHE.cm.cuenta.clave = cl; CACHE.cmAcc = "📺 " + c.plataforma + "\n📧 Correo: " + co + "\n🔑 Contraseña: " + cl;
    toast("Acceso actualizado ✓");
  });
}
function editarCm() {
  var c = CACHE.cm.cuenta;
  accEnviar("adm_cm_editar", { id: c.id, proveedor: $("aPv").value.trim(), costo: $("aCs").value.replace(/\D/g, ""), compra: $("aFc").value, vence: $("aFv").value }, function () { toast("Cambios guardados ✓"); verCm(c.id); });
}
function agregarCm() {
  var c = CACHE.cm.cuenta, n = $("aN").value, pr = $("aPr").value.replace(/\D/g, "");
  if (!pr) return $("aErr").textContent = "Escribe el precio por perfil.";
  if (!confirm("¿Agregar " + n + " perfil(es) a " + c.id + "?")) return;
  accEnviar("adm_cm_agregar", { id: c.id, n: n, precio: pr }, function () { toast("Perfiles agregados ✓"); verCm(c.id); });
}
function caidaCm() {
  var c = CACHE.cm.cuenta, movs = [], vistos = {}, dup = false;
  [].forEach.call(document.querySelectorAll("#accBox select[data-from]"), function (s) { if (!s.value) return; if (vistos[s.value]) dup = true; vistos[s.value] = 1; movs.push({ from: Number(s.getAttribute("data-from")), to: Number(s.value) }); });
  var marcar = $("aMarcar").checked;
  if (dup) return $("aErr").textContent = "Dos clientes tienen el mismo perfil destino.";
  if (!movs.length && !marcar) return $("aErr").textContent = "Elige al menos un cliente para mover o marca la cuenta como caída.";
  if (!confirm("¿Confirmas? Se moverán " + movs.length + " cliente(s)" + (marcar ? " y " + c.id + " quedará como CAÍDA." : "."))) return;
  accEnviar("adm_cm_caida", { id: c.id, movs: movs, marcar: marcar }, function (r) {
    $("accBox").innerHTML = '<div class="card"><b>✅ Listo</b><pre class="acc">' + esc(r.texto) + '</pre>' + msgLista(r.mensajes, "Envía a cada cliente sus datos nuevos") +
      '<button class="btn sec sm" style="margin-top:10px" onclick="verCm(\'' + esc(c.id) + '\')">Ver la cuenta actualizada</button></div>';
    toast("Listo ✓");
  });
}
function reactivarCm() {
  var c = CACHE.cm.cuenta;
  if (!confirm("¿Quitar la marca de caída a " + c.id + "? Sus perfiles libres vuelven a venderse.")) return;
  api("adm_cm_reactivar", { id: c.id }).then(function () { toast("Cuenta reactivada ✓"); verCm(c.id); }).catch(function (e) { toast(e.message); });
}
function eliminarCm() {
  var c = CACHE.cm.cuenta, conf = $("aConf").value.trim();
  if (normTxt(conf).replace(/\s+/g, "") !== normTxt(c.id).replace(/\s+/g, "")) return $("aErr").textContent = "Escribe el ID exacto: " + c.id;
  if (!confirm("Última confirmación: ¿eliminar " + c.id + " y sus perfiles?")) return;
  accEnviar("adm_cm_eliminar", { id: c.id, confirmar: conf }, function () { toast("Cuenta eliminada"); ir("cuentas"); });
}
function pinCm(fila, btn) {
  var inp = $("pf_" + fila).querySelector("input.pin"), pin = inp.value.replace(/\D/g, "");
  if (pin && pin.length !== 4) return toast("El PIN debe tener 4 números");
  btn.disabled = true; btn.textContent = "…";
  api("adm_cm_pin", { id: CACHE.cm.cuenta.id, fila: fila, pin: pin }).then(function (r) {
    btn.disabled = false; btn.textContent = "✓"; setTimeout(function () { btn.textContent = "💾"; }, 1500); toast("PIN guardado ✓");
    $("pinRes").innerHTML = msgLista(r.mensajes, "Avisa al cliente del nuevo PIN");
  }).catch(function (e) { btn.disabled = false; btn.textContent = "💾"; toast(e.message); });
}

// ---------- Ajustes ----------

// ---------- Garantías ----------
var GAR_MOTIVOS = ["No carga / error al reproducir", "Límite de pantallas o dispositivo bloqueado", "Cambiaron la contraseña", "Perfil borrado o modificado", "Cuenta caída", "Otro"];
function garCaja(fila) { return $("f_" + fila) ? $("f_" + fila).querySelector(".res") : $("garCm"); }
function garDesdeCm(fila) { garForm(fila); }
function garForm(fila) {
  var box = garCaja(fila); if (!box) return;
  box.innerHTML = '<div class="load">Buscando perfiles disponibles…</div>';
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  api("adm_gar_opciones", { fila: fila }).then(function (r) {
    CACHE.gar = r; var o = r.origen;
    var misma = r.destinos.filter(function (d) { return d.mismaCuenta; }), otras = r.destinos.filter(function (d) { return !d.mismaCuenta && !d.cuentaNueva; }), nuevas = r.destinos.filter(function (d) { return d.cuentaNueva; });
    var opt = function (d) { return '<option value="' + d.fila + '">' + esc(d.cuenta) + ' · perfil ' + esc(d.perfil) + (d.cuentaNueva ? ' ⚠️ cuenta sin clientes' : '') + '</option>'; };
    var grp = function (t, l) { return l.length ? '<optgroup label="' + esc(t) + '">' + l.map(opt).join("") + '</optgroup>' : ''; };
    box.innerHTML = '<div class="card acc-form" style="margin-top:10px"><div class="row"><b>🛡 Garantía · ' + esc(o.cliente) + '</b><span class="sp"></span><button class="btn sec sm" onclick="this.closest(\'.acc-form\').remove()">Cerrar</button></div>' +
      '<div class="mut" style="margin-top:4px">' + esc(o.plataforma) + ' · ' + esc(o.cuenta) + ' perfil ' + esc(o.perfil) + ' · vence ' + esc(o.vence) + ' · paga ' + pesos(o.vendido) + '</div>' +
      '<label class="f">Motivo</label><select class="in" id="gMot">' + GAR_MOTIVOS.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join("") + '</select>' +
      '<label class="f">Solución</label><select class="in" id="gDst" onchange="garImpacto()"><option value="">Resolver en el mismo perfil (sin mover)</option>' +
      grp("Misma cuenta", misma) + grp("Otras cuentas con clientes", otras) + grp("Cuentas sin clientes (empiezan a consumirse)", nuevas) + '</select>' +
      (!r.destinos.length ? '<div class="err">No hay perfiles libres de ' + esc(o.plataforma) + '. Agrega perfiles o crea una cuenta en Cuentas madre.</div>' : '') +
      '<div id="gOrig" style="display:none"><label class="f">¿Qué pasa con el perfil ' + esc(o.perfil) + ' de ' + esc(o.cuenta) + '?</label>' +
      '<label class="gopt"><input type="radio" name="gOr" value="liberar" checked onchange="garImpacto()"><span><b>Liberar</b> — vuelve a la venta (el problema era del cliente o ya se arregló)</span></label>' +
      '<label class="gopt"><input type="radio" name="gOr" value="bloquear" onchange="garImpacto()"><span><b>Bloquear</b> — queda fuera de venta hasta que lo revises y desbloquees</span></label></div>' +
      '<div id="gImp"></div>' +
      '<label class="f">Nota (opcional)</label><input class="in" id="gNota" maxlength="200" placeholder="Ej.: el proveedor cambió la clave">' +
      '<div class="err" id="gErr"></div><button class="btn" id="gBtn" style="margin-top:12px" onclick="garAplicar(' + fila + ')">Aplicar garantía</button><div id="gRes"></div></div>';
    garImpacto();
  }).catch(function (e) { box.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function garImpacto() {
  var r = CACHE.gar; if (!r || !$("gDst")) return;
  var f = Number($("gDst").value), d = r.destinos.filter(function (x) { return x.fila === f; })[0];
  var orEl = document.querySelector('input[name="gOr"]:checked'), bloq = orEl && orEl.value === "bloquear";
  $("gOrig").style.display = d ? "" : "none";
  var h, cls = "";
  if (!d) h = 'Sin impacto en inventario: el cliente sigue en su mismo perfil. Solo se registra el caso.';
  else {
    var l = [];
    l.push('El cliente pasa a <b>' + esc(d.cuenta) + ' perfil ' + esc(d.perfil) + '</b> con la misma fecha de vencimiento y el mismo valor (' + pesos(r.origen.vendido) + ').');
    if (d.mismaCuenta) l.push('Misma cuenta: no cambia el correo ni la contraseña.');
    if (d.cuentaNueva) { cls = "warn"; l.push('⚠️ <b>' + esc(d.cuenta) + ' no tiene clientes</b>: empiezas a usar una cuenta nueva' + (d.costoSlot ? ' (cada perfil cuesta ~' + pesos(d.costoSlot) + ' de esa cuenta)' : '') + '. Si puedes, usa una cuenta que ya tenga clientes.'); }
    else l.push('Usas 1 perfil libre que podías vender por ' + pesos(d.lista) + '/mes.');
    if (bloq) { cls = "bad"; l.push('🔒 El perfil original queda bloqueado: <b>dejas de vender ' + pesos(r.origen.lista) + '/mes</b> hasta que lo desbloquees. Pierdes 2 perfiles vendibles en vez de 1.'); }
    else l.push('El perfil original vuelve a quedar libre para la venta: inventario neto sin cambios.');
    h = l.join('<br>');
  }
  $("gImp").innerHTML = '<div class="gimp ' + cls + '"><b>Impacto en el negocio</b><br>' + h + '</div>';
}
function garAplicar(fila) {
  var dst = $("gDst").value, orEl = document.querySelector('input[name="gOr"]:checked');
  var d = { fila: fila, destino: dst, motivo: $("gMot").value, nota: $("gNota").value, origen: dst && orEl ? orEl.value : "liberar" };
  var dd = (CACHE.gar.destinos || []).filter(function (x) { return String(x.fila) === String(dst); })[0];
  if (dd && dd.cuentaNueva && !confirm("Vas a empezar a usar " + dd.cuenta + ", que no tiene clientes. ¿Continuar?")) return;
  var b = $("gBtn"), err = function (t) { $("gErr").textContent = t; };
  err(""); b.disabled = true; b.textContent = "Aplicando…";
  api("adm_garantia", d).then(function (r) {
    b.textContent = "✓ Garantía registrada"; toast("Garantía registrada ✓");
    $("gRes").innerHTML = '<div style="margin-top:10px"><span class="pill ok">' + (r.movido ? "Cliente reubicado" : "Caso registrado") + '</span>' + (r.impacto ? ' <span class="pill bad">−' + pesos(r.impacto) + '/mes bloqueado</span>' : '') + (r.cuentaNueva ? ' <span class="pill warn">cuenta nueva en uso</span>' : '') + '</div>' +
      msgBox(r.mensaje, "Mensaje para el cliente") + (r.mensaje ? '' : '<div class="mut" style="margin-top:8px">El cliente no tiene WhatsApp registrado.</div>');
  }).catch(function (e) { b.disabled = false; b.textContent = "Aplicar garantía"; err(e.message); });
}
function garDesbloquear(fila, btn, enCuenta) {
  var pin = window.prompt("El perfil vuelve a la venta. Si le cambiaste el PIN, escríbelo (4 números). Déjalo vacío para no cambiarlo.", "");
  if (pin === null) return;
  btn.disabled = true; btn.textContent = "Desbloqueando…";
  api("adm_gar_desbloquear", { fila: fila, pin: pin }).then(function () {
    toast("Perfil disponible ✓");
    if (enCuenta && CACHE.cm) verCm(CACHE.cm.cuenta.id); else VISTAS.garantias();
  }).catch(function (e) { btn.disabled = false; btn.textContent = "🔓 Desbloquear"; toast(e.message); });
}
VISTAS.garantias = function () {
  cargando("Cargando garantías…");
  api("adm_garantias").then(function (r) {
    var s = r.resumen;
    var h = '<h2>Garantías · este mes</h2><div class="fgrid">' + finKpi("Casos", String(s.casosMes)) + finKpi("Clientes reubicados", String(s.reubicadosMes)) +
      finKpi("Cuentas nuevas usadas", String(s.cuentasNuevasMes), null, s.cuentasNuevasMes ? "⚠️ subieron costos" : "") +
      finKpi("Perfiles bloqueados", String(s.bloqueados)) + finKpi("Venta perdida al mes", pesos(s.impactoMensual), null, s.impactoMensual ? "hasta desbloquearlos" : "") + '</div>' +
      '<div class="card" style="margin-top:12px"><b>¿Cómo hago una garantía?</b><div class="mut" style="margin-top:6px;line-height:1.55">Abre el cliente en 👥 Clientes (o la cuenta en 🏦 Cuentas) y toca <b>🛡 Garantía</b> en su perfil. Primero intenta resolver en el mismo perfil; si hay que moverlo, prefiere la misma cuenta u otra que ya tenga clientes. Bloquea el perfil original solo si de verdad no sirve.</div></div>' +
      (s.motivos.length ? '<h2 style="margin-top:16px">Motivos del mes</h2><div class="chips">' + s.motivos.map(function (m) { return '<span class="chip">' + esc(m.motivo) + ' · ' + m.n + '</span>'; }).join("") + '</div>' : '') +
      '<h2 style="margin-top:16px">Perfiles bloqueados (' + r.bloqueados.length + ')</h2>' +
      (r.bloqueados.length ? r.bloqueados.map(function (b) {
        return '<div class="card"><div class="row"><b>' + esc(b.plataforma) + '</b><span class="mut">' + esc(b.cuenta) + ' · perfil ' + esc(b.perfil) + '</span><span class="sp"></span><span class="pill bad">−' + pesos(b.lista) + '/mes</span></div>' +
          (b.motivo ? '<div class="mut" style="margin-top:4px">' + esc(b.motivo) + (b.desde ? ' · ' + esc(b.desde) : '') + '</div>' : '') +
          '<div class="row" style="margin-top:8px"><button class="btn sm" onclick="garDesbloquear(' + b.fila + ',this)">🔓 Desbloquear</button><button class="btn sec sm" onclick="verCm(\'' + esc(b.cuenta) + '\')">Ver cuenta</button></div></div>';
      }).join("") : '<div class="empty">No hay perfiles bloqueados</div>') +
      '<h2 style="margin-top:16px">Historial</h2><div class="card" style="overflow-x:auto">' +
      (r.casos.length ? '<table class="tp"><tr><th>Cliente</th><th>Cambio</th><th>Impacto</th></tr>' + r.casos.map(function (c) {
        return '<tr><td>' + (c.tel ? '<a href="#" onclick="verCliente(\'' + esc(c.tel) + '\');return false">' + esc(c.cliente) + '</a>' : esc(c.cliente)) + '<div class="mut">' + esc(c.plataforma) + ' · ' + esc(c.fecha.split(" ")[0]) + '</div></td>' +
          '<td>' + esc(c.origen) + (c.destino && c.destino !== "—" ? ' → ' + esc(c.destino) : '') + '<div class="mut">' + esc(c.motivo) + '</div></td>' +
          '<td>' + (c.impacto ? '<span class="vend">−' + pesos(c.impacto) + '/mes</span>' : '<span class="mut">' + esc(c.accion) + '</span>') + (c.cuentaNueva ? '<div class="vend">cuenta nueva</div>' : '') + '</td></tr>';
      }).join("") + '</table>' : '<div class="empty">Aún no hay garantías registradas</div>') + '</div>';
    $("vista").innerHTML = h;
  }).catch(fallo);
};

VISTAS.ajustes = function () {
  $("vista").innerHTML = '<h2>Ajustes</h2><div class="card"><b>Cambiar PIN de ingreso</b>' +
    '<label class="f">PIN actual</label><input class="in" type="password" id="pA" inputmode="numeric" maxlength="8" autocomplete="current-password">' +
    '<label class="f">PIN nuevo (4 a 8 números)</label><input class="in" type="password" id="pN" inputmode="numeric" maxlength="8" autocomplete="new-password">' +
    '<label class="f">Repite el PIN nuevo</label><input class="in" type="password" id="pN2" inputmode="numeric" maxlength="8" autocomplete="new-password">' +
    '<div class="err" id="pErr"></div><button class="btn" style="margin-top:12px" onclick="cambiarPin(this)">Guardar PIN</button></div>' +
    '<div class="card"><b>Seguridad</b><div class="mut" style="margin-top:6px">• La sesión dura 6 horas y se renueva mientras uses el panel.<br>• Con 5 PIN errados el panel se bloquea 15 minutos y te llega aviso a Telegram.<br>• Cada ingreso se avisa en Telegram.<br>• Usa “Salir” si entras desde un celular o computador que no es tuyo.</div></div>';
};
function cambiarPin(b) {
  var a = $("pA").value.replace(/\D/g, ""), n = $("pN").value.replace(/\D/g, ""), n2 = $("pN2").value.replace(/\D/g, "");
  if (n !== n2) return $("pErr").textContent = "Los PIN nuevos no coinciden.";
  if (n.length < 4) return $("pErr").textContent = "El PIN nuevo debe tener al menos 4 números.";
  if (n.length !== 4) return $("pErr").textContent = "Por ahora el teclado de ingreso usa 4 números: elige un PIN de 4.";
  b.disabled = true;
  api("adm_pin", { actual: a, nuevo: n }).then(function () { $("pErr").textContent = ""; toast("PIN actualizado ✓"); $("pA").value = $("pN").value = $("pN2").value = ""; })
    .catch(function (e) { $("pErr").textContent = e.message; }).then(function () { b.disabled = false; });
}

pintarPad(); pintarDots();
(function () {
  var t = leerSes();
  if (!t) return;
  TOKEN = t; $("login").classList.add("oculto"); $("app").classList.remove("oculto"); ir("resumen");
})();
